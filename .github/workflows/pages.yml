# The in-browser page (docs/ROADMAP.md, item 6) on GitHub Pages.
# Needs, once: repository Settings > Pages > Source: "GitHub Actions".
# The page is one file (tools/build_web_page.py); the same file can go on a shared drive.
name: pages

on:
  push:
    branches: [master]
    paths:
      - "pycorn/**"
      - "web/**"
      - "samples/u711_cadet_reference.zip"
      - "tools/build_web_page.py"
      - "setup.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the page
        run: python tools/build_web_page.py -o _site/index.html
      # the page's "Try a sample" button fetches sample.zip from the same address; this run
      # shows a whole bind/wash/elute cycle with a clear peak (samples/sample.zip is near flat)
      - name: Add the sample
        run: cp samples/u711_cadet_reference.zip _site/sample.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
