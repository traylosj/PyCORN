<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570"><rect width="100%" height="100%" fill="#fcfcfb"/><text x="20.0" y="30.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">One result, three cycles: how cycles and chromatograms relate</text><text x="20.0" y="50.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Synthetic schematic (drawn by Claude). A cycle (unit procedure) starts and ends between UNICORN phases.</text><text x="20.0" y="65.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">A chromatogram is only how the data was recorded.</text><text x="186.0" y="97.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600">UNICORN phases</text><text x="186.0" y="111.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#898781" text-anchor="end" font-weight="normal">(ISA-88 operations)</text><rect x="200.00" y="80.00" width="55.00" height="26.00" rx="3" fill="#ecebe5" stroke="#fcfcfb" stroke-width="1.5"/><text x="227.5" y="97.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">Before</text><rect x="255.00" y="80.00" width="36.67" height="26.00" rx="3" fill="#dbe8f8" stroke="#fcfcfb" stroke-width="1.5"/><text x="273.3" y="97.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">P1</text><rect x="291.67" y="80.00" width="73.33" height="26.00" rx="3" fill="#fde3d6" stroke="#fcfcfb" stroke-width="1.5"/><text x="328.3" y="97.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">P2</text><rect x="365.00" y="80.00" width="36.67" height="26.00" rx="3" fill="#d9f2e8" stroke="#fcfcfb" stroke-width="1.5"/><text x="383.3" y="97.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">P3</text><rect x="401.67" y="80.00" width="36.67" height="26.00" rx="3" fill="#c9dcf5" stroke="#fcfcfb" stroke-width="1.5"/><text x="420.0" y="97.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">P4</text><rect x="438.33" y="80.00" width="36.67" height="26.00" rx="3" fill="#ecebe5" stroke="#fcfcfb" stroke-width="1.5"/><text x="456.7" y="97.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">P5</text><rect x="475.00" y="80.00" width="36.67" height="26.00" rx="3" fill="#dbe8f8" stroke="#fcfcfb" stroke-width="1.5"/><text x="493.3" y="97.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">P1</text><rect x="511.67" y="80.00" width="73.33" height="26.00" rx="3" fill="#fde3d6" stroke="#fcfcfb" stroke-width="1.5"/><text x="548.3" y="97.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">P2</text><rect x="585.00" y="80.00" width="36.67" height="26.00" rx="3" fill="#d9f2e8" stroke="#fcfcfb" stroke-width="1.5"/><text x="603.3" y="97.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">P3</text><rect x="621.67" y="80.00" width="36.67" height="26.00" rx="3" fill="#c9dcf5" stroke="#fcfcfb" stroke-width="1.5"/><text x="640.0" y="97.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">P4</text><rect x="658.33" y="80.00" width="36.67" height="26.00" rx="3" fill="#ecebe5" stroke="#fcfcfb" stroke-width="1.5"/><text x="676.7" y="97.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">P5</text><rect x="695.00" y="80.00" width="36.67" height="26.00" rx="3" fill="#dbe8f8" stroke="#fcfcfb" stroke-width="1.5"/><text x="713.3" y="97.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">P1</text><rect x="731.67" y="80.00" width="73.33" height="26.00" rx="3" fill="#fde3d6" stroke="#fcfcfb" stroke-width="1.5"/><text x="768.3" y="97.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">P2</text><rect x="805.00" y="80.00" width="36.67" height="26.00" rx="3" fill="#d9f2e8" stroke="#fcfcfb" stroke-width="1.5"/><text x="823.3" y="97.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">P3</text><rect x="841.67" y="80.00" width="36.67" height="26.00" rx="3" fill="#c9dcf5" stroke="#fcfcfb" stroke-width="1.5"/><text x="860.0" y="97.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">P4</text><rect x="878.33" y="80.00" width="36.67" height="26.00" rx="3" fill="#ecebe5" stroke="#fcfcfb" stroke-width="1.5"/><text x="896.7" y="97.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">P5</text><rect x="915.00" y="80.00" width="55.00" height="26.00" rx="3" fill="#ecebe5" stroke="#fcfcfb" stroke-width="1.5"/><text x="942.5" y="97.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">After</text><text x="20.0" y="150.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">A. New chromatogram</text><text x="20.0" y="166.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">at each cycle boundary</text><rect x="200.00" y="168.00" width="55.00" height="18.00" rx="3" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/><text x="227.5" y="181.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Chrom.1</text><rect x="255.00" y="168.00" width="220.00" height="18.00" rx="3" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/><text x="365.0" y="181.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Chrom.2</text><rect x="475.00" y="168.00" width="220.00" height="18.00" rx="3" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/><text x="585.0" y="181.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Chrom.3</text><rect x="695.00" y="168.00" width="220.00" height="18.00" rx="3" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/><text x="805.0" y="181.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Chrom.4</text><rect x="915.00" y="168.00" width="55.00" height="18.00" rx="3" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/><text x="942.5" y="181.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Chrom.5</text><rect x="255.00" y="140.00" width="220.00" height="18.00" rx="3" fill="none" stroke="#2a78d6" stroke-width="1.5"/><text x="365.0" y="153.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#2a78d6" text-anchor="middle" font-weight="600">cycle 1</text><rect x="475.00" y="140.00" width="220.00" height="18.00" rx="3" fill="none" stroke="#2a78d6" stroke-width="1.5"/><text x="585.0" y="153.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#2a78d6" text-anchor="middle" font-weight="600">cycle 2</text><rect x="695.00" y="140.00" width="220.00" height="18.00" rx="3" fill="none" stroke="#2a78d6" stroke-width="1.5"/><text x="805.0" y="153.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#2a78d6" text-anchor="middle" font-weight="600">cycle 3</text><text x="227.5" y="153.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal">before</text><text x="942.5" y="153.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal">after</text><line x1="255.00" y1="136.00" x2="255.00" y2="190.00" stroke="#2a78d6" stroke-width="1" stroke-dasharray="4 3"/><line x1="475.00" y1="136.00" x2="475.00" y2="190.00" stroke="#2a78d6" stroke-width="1" stroke-dasharray="4 3"/><line x1="695.00" y1="136.00" x2="695.00" y2="190.00" stroke="#2a78d6" stroke-width="1" stroke-dasharray="4 3"/><line x1="915.00" y1="136.00" x2="915.00" y2="190.00" stroke="#2a78d6" stroke-width="1" stroke-dasharray="4 3"/><text x="200.0" y="204.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Cycles from the chromatograms, when the caller says so.</text><text x="200.0" y="218.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Every cut falls between phases, so the check passes.</text><text x="20.0" y="275.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">B. New chromatogram</text><text x="20.0" y="291.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">cut inside a phase</text><rect x="200.00" y="293.00" width="55.00" height="18.00" rx="3" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/><text x="227.5" y="306.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Chrom.1</text><rect x="255.00" y="293.00" width="293.33" height="18.00" rx="3" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/><text x="401.7" y="306.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Chrom.2</text><rect x="548.33" y="293.00" width="421.67" height="18.00" rx="3" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/><text x="759.2" y="306.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Chrom.3</text><line x1="548.33" y1="269.00" x2="548.33" y2="313.00" stroke="#c8102e" stroke-width="2"/><text x="548.3" y="265.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#c8102e" text-anchor="middle" font-weight="600">cut</text><text x="200.0" y="335.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#c8102e" text-anchor="start" font-weight="normal">Phase P2 of cycle 2 crosses the cut: using these chromatograms as cycles fails.</text><text x="200.0" y="349.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#c8102e" text-anchor="start" font-weight="normal">They stay data segments; cycles can still come from the caller's rule.</text><text x="20.0" y="400.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">C. One chromatogram</text><text x="20.0" y="416.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">cycles from a rule</text><rect x="200.00" y="418.00" width="770.00" height="18.00" rx="3" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/><text x="585.0" y="431.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Chrom.1</text><rect x="255.00" y="390.00" width="220.00" height="18.00" rx="3" fill="none" stroke="#1baf7a" stroke-width="1.5"/><text x="365.0" y="403.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1baf7a" text-anchor="middle" font-weight="600">cycle 1</text><rect x="475.00" y="390.00" width="220.00" height="18.00" rx="3" fill="none" stroke="#1baf7a" stroke-width="1.5"/><text x="585.0" y="403.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1baf7a" text-anchor="middle" font-weight="600">cycle 2</text><rect x="695.00" y="390.00" width="220.00" height="18.00" rx="3" fill="none" stroke="#1baf7a" stroke-width="1.5"/><text x="805.0" y="403.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1baf7a" text-anchor="middle" font-weight="600">cycle 3</text><text x="227.5" y="403.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal">before</text><text x="942.5" y="403.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal">after</text><line x1="255.00" y1="386.00" x2="255.00" y2="440.00" stroke="#1baf7a" stroke-width="1" stroke-dasharray="4 3"/><line x1="475.00" y1="386.00" x2="475.00" y2="440.00" stroke="#1baf7a" stroke-width="1" stroke-dasharray="4 3"/><line x1="695.00" y1="386.00" x2="695.00" y2="440.00" stroke="#1baf7a" stroke-width="1" stroke-dasharray="4 3"/><text x="200.0" y="454.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">The caller's rule: "a cycle starts at each phase P1".</text><text x="200.0" y="468.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">A repeat found in the phase order is only a hint.</text><line x1="200.00" y1="494.00" x2="970.00" y2="494.00" stroke="#c3c2b7" stroke-width="1"/><text x="200.0" y="512.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Time: one clock for the whole result. Each chromatogram's own time starts at 0.</text><text x="20.0" y="540.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Every segment carries its cycle (empty before and after) and its chromatogram,</text><text x="20.0" y="555.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">so the views group by cycle however the cycles were recorded.</text></svg>
