<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="458" viewBox="0 0 1000 458"><rect width="100%" height="100%" fill="#fcfcfb"/><text x="20.0" y="30.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Flow ramps and ISA-88 states around a Pause and a Hold</text><text x="20.0" y="50.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Synthetic schematic (drawn by Claude), not data. The setpoint never changes in a transient;</text><text x="20.0" y="65.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">the actual flow is what the volume axis would show, fitted as stop, linear ramp, set flow.</text><text x="156.0" y="107.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600">ISA-88 state</text><text x="156.0" y="121.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#898781" text-anchor="end" font-weight="normal">(UNICORN: Pause, Hold)</text><rect x="170.00" y="90.00" width="175.56" height="26.00" rx="3" fill="#ecebe5" stroke="#fcfcfb" stroke-width="1.5"/><text x="257.8" y="107.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">Running</text><rect x="345.56" y="90.00" width="35.11" height="26.00" rx="3" fill="#fde3d6" stroke="#fcfcfb" stroke-width="1.5"/><text x="363.1" y="107.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">Holding</text><rect x="380.67" y="90.00" width="140.44" height="26.00" rx="3" fill="#f6c9b3" stroke="#fcfcfb" stroke-width="1.5"/><text x="450.9" y="107.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">Held</text><rect x="521.11" y="90.00" width="43.89" height="26.00" rx="3" fill="#fde3d6" stroke="#fcfcfb" stroke-width="1.5"/><text x="543.1" y="107.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">Restarting</text><rect x="565.00" y="90.00" width="131.67" height="26.00" rx="3" fill="#ecebe5" stroke="#fcfcfb" stroke-width="1.5"/><text x="630.8" y="107.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">Running</text><rect x="696.67" y="90.00" width="8.78" height="26.00" rx="3" fill="#fbe9b0" stroke="#fcfcfb" stroke-width="1.5"/><rect x="705.44" y="90.00" width="149.22" height="26.00" rx="3" fill="#f5d77e" stroke="#fcfcfb" stroke-width="1.5"/><text x="780.1" y="107.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">Paused</text><rect x="854.67" y="90.00" width="105.33" height="26.00" rx="3" fill="#ecebe5" stroke="#fcfcfb" stroke-width="1.5"/><text x="907.3" y="107.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">Running</text><text x="363.1" y="134.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#eb6834" text-anchor="middle" font-weight="normal">Pause issued</text><text x="543.1" y="134.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#eb6834" text-anchor="middle" font-weight="normal">Continue</text><text x="701.1" y="134.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Hold issued</text><text x="854.7" y="134.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Continue</text><text x="156.0" y="220.0" font-family="Segoe UI, Helvetica, Arial, sans-ser