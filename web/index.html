    return overlayEmpty(i18n("plot.tick_hint", { max: OVERLAY_MAX }));
  }
  let axis = axisChoice;
  try { axis = localStorage.getItem(AXIS_PICK) || axis; } catch (e) { /* storage blocked: this page's pick */ }
  if (overlayKey !== JSON.stringify([ids, overlayRoles, axis || null])) {
    await whenIdle();
    if (draw !== overlayDraws || !overlayOn) return;
    setBusy(true);
    begin(i18n("plot.overlay_loading", { count: ids.length }));
    await breathe();
    try {
      const r = await call("overlay", { ids, roles: overlayRoles, axis: axis || null });
      if (r.cancelled || cancelAsked) { status(i18n("status.cancelled")); return; }
      if (r.error) { status(i18n("plot.overlay_error", { error: errorOf(r) }), true); return; }
      if (draw !== overlayDraws || !overlayOn) return;
      overlayData = r;
      overlayRoles = r.shown_roles;

  const r = await winParse(winFull(text));
  if (!r || parse !== winParses) return;
  if (r.error) { winError(r.message ? errorOf(r) : r.error); $("wintext").focus(); return; }
  if (winWindows.some((w) => winNameOf(w) === r.window.name)) {
    winError(i18n("win.duplicate", { name: r.window.name }));
    $("winname").focus();
    return;
  }
  winWindows.push(r.window.text);
  winError("");
  $("winname").value = "";
  $("wintext").value = winCompose();
  winSaved();
}
function winAddCurve() {
  const name = $("wincurve").value.trim();
  if (name && !winCurveNames.includes(name)) winCurveNames.push(name);
  $("wincurve").value = "";
  winSaved();
}
// a removable item: the text and a Remove button (focus goes to the next one, else to `back`)
function winItem(list, text, remove, back) {
  const item = document.createElement("li");
  const code = document.createElement("code");
  code.textContent = text;
  const b = document.createElement("button");
  b.className = "small";
  b.textContent = i18n("win.remove");
  b.setAttribute("aria-label", i18n("win.remove_one", { name: text }));
  b.addEventListener("click", () => {
    const at = [...list.querySelectorAll("button")].indexOf(b);
    remove();
    const next = list.querySelectorAll("button")[at] || list.querySelectorAll("button")[at - 1];
    (next || back).focus();
  });
  item.append(code, b);
  list.append(item);
}
// the lists, the role boxes and the texts that depend on the language
function winRender() {
  const list = $("winlist");
  list.innerHTML = "";
  winWindows.forEach((w, i) => winItem(list, w, () => { winWindows.splice(i, 1); winSaved(); }, $("wintext")));
  const roles = $("winroles");
  roles.innerHTML = "";
  for (const r of Object.keys(ROLE_NAMES)) {
    const lab = document.createElement("label");
    const tick = document.createElement("input");
    tick.type = "checkbox";
    tick.value = r;
    tick.checked = winRoles.has(r);
    tick.addEventListener("change", () => { if (tick.checked) winRoles.add(r); else winRoles.delete(r); winSaved(false); });
    lab.append(tick, roleName(r));
    roles.append(lab);
  }
  const names = $("winnamelist");
  names.innerHTML = "";
  winCurveNames.forEach((c, i) => winItem(names, c, () => { winCurveNames.splice(i, 1); winSaved(); }, $("wincurve")));
  $("winclear").disabled = !winWindows.length && !winRoles.size && !winCurveNames.length;
}
// a window or curve added or removed: kept, drawn, the table again (or hidden), the panel's line
function winSaved(render = true) {
  saveWindowSettings();
  if (render) winRender(); else $("winclear").disabled = !winWindows.length && !winRoles.size && !winCurveNames.length;
  if (!winSet()) winHide();
  updatePanel();
  winChanged(true);
}
function winHide() {
  $("wintable").hidden = true;
  $("winnotes").innerHTML = "";
  winKey = null;
}
function winClear() {
  winWindows = [];
  winRoles = new Set();
  winCurveNames = [];
  winError("");
  $("winname").value = "";
  $("winfrom").value = "0";
  $("winto").value = "end";
  $("wintext").value = winCompose();
  winSaved();
  $("wintext").focus();
}
// the phases, units and curve names Python found in the runs
function winFillPickers() {
  const phase = $("winphase"), keep = phase.value;
  phase.innerHTML = "";
  for (const p of (winInfo && winInfo.phases) || []) phase.add(new Option(p, p));
  if (keep) setOption(phase, keep);
  const unit = $("winunit"), u = unit.value || "min";
  unit.innerHTML = "";
  for (const x of (winInfo && winInfo.units) || WIN_UNITS) unit.add(new Option(x, x));
  setOption(unit, u);
  const names = $("wincurvenames");
  names.innerHTML = "";
  for (const c of (winInfo && winInfo.curves) || []) names.append(new Option(c, c));
  if (!$("wintext").value.trim()) $("wintext").value = winCompose();
}
// the runs, their chromatograms, the windows or the curves changed: the section again (when open)
function winChanged(now) {
  clearTimeout(winTimer);
  if (!current || !$("winbox").open) return;
  winTimer = setTimeout(winRefresh, now ? 0 : 400);
}
async function winRefresh() {
  const draw = ++winDraws, ids = winIds();
  if (!ids.length) return;
  const infoKey = JSON.stringify(ids);
  if (winInfoKey !== infoKey) {
    await whenIdle();
    if (draw !== winDraws) return;
    setBusy(true);
    const before = [$("status").textContent, $("statusbar").className === "error"];
    begin(i18n("win.loading"));
    await breathe();
    try {
      const r = await call("windowInfo", { ids });
      if (r.cancelled || cancelAsked) { status(i18n("status.cancelled")); return; }
      if (r.error) { status(i18n("win.error", { error: errorOf(r) }), true); return; }
      winInfo = r;
      winInfoKey = infoKey;
      winFillPickers();
      status(...before);
    } catch (e) {
      if (!(e instanceof Stopped)) status(i18n("win.error", { error: errText(e) }), true);
      return;
    } finally {
      setBusy(false);
    }
  }
  if (draw !== winDraws) return;
  if (!winSet()) { winHide(); return; }
  const curves = winCurves(), key = JSON.stringify([ids, winWindows, curves]);
  if (winKey === key) return;
  await whenIdle();
  if (draw !== winDraws) return;
  setBusy(true);
  begin(i18n("win.computing"));
  await breathe();
  try {
    const r = await call("windowStats", { ids, windows: winWindows, curves, labels: winLabels(ids) });
    if (r.cancelled || cancelAsked) { status(i18n("status.cancelled")); return; }
    if (r.error) { status(i18n("win.error", { error: errorOf(r) }), true); return; }
    if (draw !== winDraws) return;
    winKey = key;
    $("wintable").hidden = false;
    setTable($("phase_windows"), r.table);
    noteList($("winnotes"), i18n("win.notes"), [...r.warnings, ...r.failed.map((f) => msgText(f.message))]);
    status(i18n("win.shown", { rows: r.table.rows.length }));
  } catch (e) {
    if (!(e instanceof Stopped)) status(i18n("win.error", { error: errText(e) }), true);
  } finally {
    setBusy(false);
  }
}

// the Excel / CSV options: mask, size, the table groups and the phase windows (M22: both set, as
// --window + --window-curves); the curves go separately (tickedCurves)
const tableOptions = () => Object.assign({ mask: $("mask").checked, sample: sizeOptions(), groups: tickedGroups() },
  winSet() ? { windows: [...winWindows], window_curves: winCurves() } : {});

// the shown run: Excel (a small zip: workbook and README.txt, or the bare workbook from an older
// Python), CSV (a zip) or CADET-Core (JSON, or a zip). Python takes the ticked curves as
// options.curves.
async function download(kind) {
  if (shown === null || busy) return;
  setBusy(true);
  const notes = $("dlnotes");
  notes.innerHTML = "";
  begin(kind === "core" ? i18n("status.writing_core") : i18n("status.writing", { kind: kindName(kind) }));
  await breathe();
  try {
    const opts = kind === "core" ? await coreOptions() : { ...tableOptions(), curves: tickedCurves() };
    opts.chromatograms = tickedChroms(shown);  // W17: the ticked ones (null: the original one)
    const r = await call("download", { index: shown, kind, options: opts });
    if (cancelAsked) { status(i18n("status.cancelled")); return; }
    if (r.error) { status(i18n("status.not_written", { error: errorOf(r) }), true); return; }
    save(r);
    status(i18n("status.saved", { name: r.name }));
    noteList(notes, i18n("download.check_before"), (r.warnings || []).map(msgText));
  } catch (e) {
    if (!(e instanceof Stopped)) status(i18n("status.not_written", { error: errText(e) }), true);
  } finally {
    setBusy(false);
  }
}

// a file Python wrote (its bytes, from the engine), to the browser's downloads, typed by its name
const MIME = { zip: "application/zip", json: "application/json", csv: "text/csv", txt: "text/plain",
               xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" };
function save(r) {
  const ext = String(r.name).split(".").pop().toLowerCase();
  saveBlob(new Blob([r.bytes], MIME[ext] ? { type: MIME[ext] } : {}), r.name);
}

function saveBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

function noteList(el, head, items) {
  el.innerHTML = "";
  if (!items.length) return;
  el.className = "warn";
  el.append(head);
  const ul = document.createElement("ul");
  ul.className = "notes";
  for (const w of items) li(ul, w);
  el.append(ul);
}

// several runs (ticked, or all in the list) in one zip, one folder per run as `pycorn export`
// writes them: Session.export_start(ids, curves=[names], ...), then one run per step
async function downloadMany(kind, ids) {
  if (!ready || busy || !ids.length) return;
  setBusy(true);
  const notes = $("dlnotes");
  notes.innerHTML = "";
  begin(i18n("status.writing", { kind: kindName(kind) }));
  try {
    // W17: per run, its ticked chromatograms (a run without a picker: its original one)
    const chromatograms = {};
    for (const i of ids) if (tickedChroms(i)) chromatograms[i] = tickedChroms(i);
    const r = await call("all", { kind, ids, curves: tickedCurves(), options: { ...tableOptions(), chromatograms } });
    if (r.cancelled || cancelAsked) { status(i18n("status.cancelled")); return; }
    if (r.error) { status(i18n("status.not_written", { error: errorOf(r) }), true); return; }
    save(r);
    status(i18n("status.saved_all", { name: r.name, count: r.runs }));
    noteList(notes, i18n("list.not_written_all"), (r.messages || r.warnings || []).map(msgText));
  } catch (e) {
    if (!(e instanceof Stopped)) status(i18n("status.not_written", { error: errText(e) }), true);
  } finally {
    setBusy(false);
  }
}

$("lang").addEventListener("change", (e) => {
  lang = e.target.value;
  try { localStorage.setItem(LANG_PICK, lang); } catch (err) { /* storage blocked: kept for this page */ }
  applyLanguage();
  showVersion();
  if (busy && !cancelAsked) $("cancel").textContent = i18n("cancel");
  // tables and pickers drawn with the old language's texts
  if (current) showChrom(Number($("chrom").value) || 0);
  for (const id of [...drawn]) fillTable($(id), tableData[id]);
});
$("files").addEventListener("change", (e) => { addFiles([...e.target.files]); e.target.value = ""; });
$("overrides").addEventListener("change", showOverridesName);
// The cursor label: a touch screen has no mouse to move away, and on a phone the label can cover
// the whole plot. A tap outside the plot, a second tap on it while the label shows, or Esc close it.
const hoverShown = () => !!document.querySelector("#plot .hoverlayer > *");
const unhover = () => { if (hoverShown()) Plotly.Fx.unhover("plot"); };
let tapClears = null;  // where a tap began that is to close the label, not move it
document.addEventListener("pointerdown", (e) => {
  if (!$("plot").contains(e.target)) { unhover(); return; }
  tapClears = e.pointerType !== "mouse" && hoverShown() ? [e.clientX, e.clientY] : null;
}, true);
document.addEventListener("pointerup", (e) => {
  const at = tapClears;
  tapClears = null;
  // a drag (zoom or pan) is not a tap; the wait: Plotly draws its label after the tap
  if (at && Math.hypot(e.clientX - at[0], e.clientY - at[1]) < 10) setTimeout(unhover, 150);
}, true);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") unhover(); });
// across the small-screen width (a phone turned, a window narrowed): the plot is laid out again
SMALL.addEventListener("change", () => {
  if (current) drawPlot(current.chromatograms[Number($("chrom").value) || 0], plotRanges());
});
// files dropped anywhere on the page are added: a drop that misses the box would otherwise make
// the browser open the file and leave the page
const drop = $("drop");
const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes("Files");
window.addEventListener("dragover", (e) => { if (hasFiles(e)) { e.preventDefault(); drop.classList.add("over"); } });
window.addEventListener("dragleave", (e) => { if (!e.relatedTarget) drop.classList.remove("over"); });
window.addEventListener("drop", (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  drop.classList.remove("over");
  addFiles([...e.dataTransfer.files]);
});
$("trysample").addEventListener("click", trySample);
$("cancel").addEventListener("click", cancelJob);
$("retry").addEventListener("click", () => location.reload());
$("runfilter").addEventListener("input", filterRuns);
for (const th of $("runs").tHead.rows[0].cells) {
  if (th.classList.contains("tick")) continue;  // the tick-all box, not a sort
  th.tabIndex = 0;
  th.addEventListener("click", () => sortRuns(th));
  th.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sortRuns(th); } });
}
// the system's light/dark switch while the page is open: the plot follows (the zoom is kept)
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (!current) return;
  drawPlot(current.chromatograms[Number($("chrom").value) || 0], plotRanges());
});
$("img-png").addEventListener("click", () => saveImage("png"));
$("img-svg").addEventListener("click", () => saveImage("svg"));
$("chrom").addEventListener("change", (e) => showChrom(Number(e.target.value)));
// Overlay / Stacked: kept in this browser (a setting); the x zoom stays, the y axes start over
for (const [id, mode] of [["lay-overlay", "overlay"], ["lay-stacked", "stacked"]]) {
  $(id).addEventListener("click", () => {
    if ((mode === "stacked") === stackedOn()) return;
    layoutChoice = mode;
    try { localStorage.setItem(LAYOUT_PICK, mode); } catch (err) { /* storage blocked: kept for this page */ }
    if (current) drawPlot(current.chromatograms[Number($("chrom").value) || 0], { xaxis: plotRanges().xaxis }, true);
  });
}
// W11: this run or the ticked runs; Curves / Runs as panels, kept in this browser (the x zoom stays)
$("src-one").addEventListener("click", () => setSource(false));
$("src-ticked").addEventListener("click", () => setSource(true));
for (const [id, mode] of [["lay-roles", "roles"], ["lay-runs", "runs"]]) {
  $(id).addEventListener("click", () => {
    if ((mode === "runs") === overlayByRuns()) return;
    overlayLayoutChoice = mode;
    try { localStorage.setItem(OVERLAY_PICK, mode); } catch (err) { /* storage blocked: kept for this page */ }
    if (overlayOn && current) drawOverlay({ xaxis: plotRanges().xaxis });
  });
}
$("xaxis").addEventListener("change", (e) => {
  axisChoice = e.target.value;
  try { localStorage.setItem(AXIS_PICK, axisChoice); } catch (err) { /* storage blocked: kept for this page */ }
  drawPlot(current.chromatograms[Number($("chrom").value) || 0]);
});
$("tickall").addEventListener("change", tickAllShown);
// Shift-click ticks a range: no text selected in the list by it
$("runs").tBodies[0].addEventListener("mousedown", (e) => { if (e.shiftKey && !e.target.closest("input, details")) e.preventDefault(); });
// the download panel: every change is kept (settings only) and the panel redrawn
$("dlpanel").addEventListener("change", (e) => {
  if (e.target.name === "dlscope") scopeWanted = e.target.value;
  if (e.target.id === "sizemode") updateSize();
  if (e.target.id !== "overrides") saveDownloadSettings();
  updatePanel();
});
// placed before it shows (beforetoggle), so it never appears elsewhere first
$("dlpanel").addEventListener("beforetoggle", (e) => {
  if (e.newState !== "open") return;
  updatePanel();
  placePanel();
});
const placeOpenPanel = () => { if ($("dlpanel").matches(":popover-open")) placePanel(); };
window.addEventListener("resize", placeOpenPanel);
window.addEventListener("scroll", placeOpenPanel, { passive: true });
$("dlgo").addEventListener("click", startDownload);
$("clear").addEventListener("click", async () => {
  if (busy || !ready) return;
  setBusy(true);
  try { await call("clear"); } catch (e) { /* the list is cleared here anyway; a restart reads `kept` only */ }
  finally { setBusy(false); }
  kept = [];
  chromLists.clear();
  chromTicks.clear();
  $("runs").tBodies[0].innerHTML = "";
  $("runfilter").value = "";
  $("view").hidden = true;
  $("notread").hidden = true;
  $("dlnotes").innerHTML = "";
  shown = null;
  current = null;
  anchorIndex = null;
  winInfo = null;  // the runs' phases and curves (the windows and curves picked stay)
  winInfoKey = null;
  winHide();
  listShown();
  status(i18n("status.cleared"));
});

$("more").addEventListener("toggle", moreToggled);
// M22: the window form
$("winbox").addEventListener("toggle", () => winChanged(true));
for (const id of ["winphase", "winunit"]) $(id).addEventListener("change", winPickerChanged);
for (const id of ["winfrom", "winto", "winname"]) $(id).addEventListener("input", winPickerChanged);
$("wintext").addEventListener("input", () => {
  clearTimeout(winParseTimer);
  winParseTimer = setTimeout(() => winTextEdited(true), 400);
});
for (const [id, run] of [["wintext", winAdd], ["winfrom", winAdd], ["winto", winAdd], ["winname", winAdd], ["wincurve", winAddCurve]]) {
  $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); run(); } });
}
$("winadd").addEventListener("click", winAdd);
$("wincurveadd").addEventListener("click", winAddCurve);
$("winclear").addEventListener("click", winClear);

loadDownloadSettings();
loadViewSettings();
loadWindowSettings();
winFillPickers();
lang = chooseLanguage();
applyLanguage();
status(i18n("status.downloading"));
start();
</script>
</body>
