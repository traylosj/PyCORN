<!DOCTYPE html>

  python tools/build_web_page.py, which puts the PyCORN wheel and its pure-Python dependencies
  into the "wheels" script element. The built page is one file: open it from GitHub Pages or a
  shared drive. Python runs in the browser (Pyodide); dropped files never leave the computer.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Content-Security-Policy (tools/build_web_page.py puts this page's own script hash in). What the
     browser then allows: this script, the Pyodide and Plotly files from their two CDNs, requests
     to those CDNs and to this page's own address (the sample), nothing else: a file you drop
     cannot be sent anywhere. 'unsafe-eval' is Pyodide's (it loads numpy and pandas with it; the
     engine also runs pyodide.js with it, after checking its hash); the web worker that runs
     Python is made from the engine text in this page (worker-src blob:) and keeps this policy;
     styles are inline because Plotly writes them. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src __PYCORN_SCRIPT_HASH__ 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://cdn.plot.ly; style-src 'unsafe-inline'; connect-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob:; font-src 'self' data:; worker-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title></title>
<link rel="icon" href="data:,">

<!-- integrity: the browser refuses this file if the CDN serves anything else (update with the version);
     Pyodide is loaded by the engine below (PYODIDE, PYODIDE_SRI), checked the same way -->

  /* a small screen (a phone): small controls, less space around them, more for the plot (the
     same width as SMALL in the script) */
  @media (max-width: 600px) {
    html { font-size: 14px; }
    header { padding: 8px 12px; }
    header h1 { font-size: 1.1rem; }
    header select { min-height: 26px; }
    h2 { font-size: 1.05rem; margin: 12px 0 6px; }
    main { padding: 10px; }
    #statusbar { padding: 6px 10px; margin-bottom: 8px; }
    #drop { padding: 12px; }
    .box { padding: 8px 10px; }
    .card { padding: 0 8px 6px; margin: 8px 0; }
    .card > h2 { margin-top: 8px; }

    button { min-height: 28px; padding: 3px 10px; font-size: 0.8125rem; margin: 2px 4px 2px 0; }
    .tools button, div.cols button, button.small { min-height: 0; padding: 2px 8px; font-size: 0.75rem; }
    button.chip { min-height: 22px; padding: 1px 8px 1px 6px; font-size: 0.75rem; gap: 5px; }

    label { margin-right: 8px; font-size: 0.8125rem; }

    #plot .modebar-btn { font-size: 13px; }

<body>
<header>
  <!-- every text a person reads comes from web/i18n/<language>.json (data-i18n: text, data-i18n-html: text with links) -->
  <select id="lang" hidden></select>
  <h1><span data-i18n="title"></span> <span class="privacy" data-i18n-html="privacy"></span></h1>
</header>
<main>
  <!-- shown in every language but English (applyLanguage) -->
  <p class="muted" id="translation-note" data-i18n="translation.note" hidden></p>
  <!-- Cancel: shown while Python works; stops at the next step, then "Stop now" restarts Python -->
  <!-- Download: one button, shown once runs are listed; it opens the download panel -->
  <div id="statusbar"><div id="status" role="status" aria-live="polite" aria-atomic="true"></div>
    <button id="cancel" class="small" hidden></button>
    <button id="dlopen" class="primary" popovertarget="dlpanel" aria-haspopup="dialog" data-i18n="download.title" hidden></button></div>
  <p><button id="retry" data-i18n="status.retry" hidden></button></p>

  <!-- Every download in one panel (popover: Esc or a click outside closes it). Its settings are
       kept in this browser across visits (DL_PICK); never anything from a file. -->
  <div id="dlpanel" class="menu" popover="auto" role="dialog" aria-labelledby="dlhead">
    <p><strong id="dlhead" data-i18n="download.title"></strong></p>
    <fieldset><legend data-i18n="dl.format"></legend>
      <label><input type="radio" name="dlformat" value="xlsx" checked> <span data-i18n="download.xlsx"></span></label>
      <label><input type="radio" name="dlformat" value="csv"> <span data-i18n="download.csv"></span></label>
      <label><input type="radio" name="dlformat" value="core"> <span data-i18n="core.title"></span></label>
    </fieldset>
    <fieldset><legend data-i18n="dl.what"></legend>
      <label><input type="radio" name="dlscope" value="shown" checked> <span data-i18n="dl.scope_shown"></span> <span class="name" id="dlshown"></span></label>
      <label><input type="radio" name="dlscope" value="ticked"> <span id="dlticked"></span></label>
      <label><input type="radio" name="dlscope" value="all"> <span id="dlall"></span></label>
    </fieldset>
    <div id="dltables">
      <!-- W16: what goes in. Curves: the plot's chips (named) or all; tables: one box per page group
           (names.groups), each group's tables named under it (buildGroups) -->
      <fieldset><legend data-i18n="dl.curves_title"></legend>
        <label><input type="radio" name="dlcurvesel" value="chips" checked> <span data-i18n="dl.curves_chips"></span></label>
        <label><input type="radio" name="dlcurvesel" value="all"> <span data-i18n="dl.curves_every"></span></label>
        <p class="muted" id="dlcurves"></p>
      </fieldset>
      <fieldset id="dlgroups"><legend data-i18n="dl.tables"></legend></fieldset>
      <p class="muted" id="dlalways"></p>
      <p class="muted" id="dlwindows" hidden></p>
      <p><label><input type="checkbox" id="mask"> <span data-i18n="download.mask"></span></label></p>
      <p>
        <label><span data-i18n="size.label"></span>
          <select id="sizemode">
            <option value="all" data-i18n="size.all"></option>
            <option value="grid" data-i18n="size.grid"></option>
            <option value="every" data-i18n="size.every"></option>
            <option value="hybrid" data-i18n="size.hybrid"></option>
          </select></label>
        <input type="number" id="sizevalue" step="any" min="1" hidden>
      </p>
      <p class="muted" id="sizenote" data-i18n-html="size.note" hidden></p>
    </div>
    <div id="dlcore" class="core" hidden>
      <p class="warn" data-i18n-html="dl.cadetExperimental"></p>
      <p>
        <label><span data-i18n="core.version"></span> <select id="coreversion"><option value="6">6</option><option value="5">5</option></select></label>
        <label><span data-i18n="core.bed"></span> <input type="number" id="bed" step="any" min="0"> cm</label>
        <label><span data-i18n="core.diameter"></span> <input type="number" id="diam" step="any" min="0"> cm</label>
        <label><span data-i18n="core.particle"></span> <input type="number" id="part" step="any" min="0"> um</label>
      </p>
      <p><span id="overrideslabel" data-i18n="core.overrides"></span>
        <label class="filepick"><input type="file" id="overrides" aria-labelledby="overrideslabel" accept=".json"><span data-i18n="file.choose_one"></span></label>
        <span class="muted" id="overridesname"></span></p>
      <p class="muted" data-i18n-html="core.note"></p>
    </div>
    <p><button id="dlgo" class="primary" data-i18n="download.title"></button></p>
    <div id="dlnotes"></div>
  </div>

  <div id="drop" class="disabled">
    <!-- the file inputs are hidden behind a label in the page's language (a browser names its own
         button in the browser's language, not the page's). Once runs are listed: one line (compact) -->
    <p><strong id="droptitle" class="big" data-i18n="drop.title"></strong><strong class="add" data-i18n="shell.add_files"></strong> <span data-i18n="drop.or"></span>
      <label class="filepick"><input type="file" id="files" aria-labelledby="droptitle" multiple disabled accept=".zip,.Result,.result,.UFol,.ufol"><span data-i18n="file.choose"></span></label></p>
  </div>
  <!-- outside #drop, which is disabled while Python loads: the link must work right away.
       The button shows only where a sample.zip sits next to this page (GitHub Pages). -->
  <p class="muted" id="samplehint"><span data-i18n-html="sample.hint"></span> <button id="trysample" class="primary" data-i18n="sample.button" hidden disabled></button></p>
  <div id="notread" class="box warn" hidden></div>

  <section id="list" class="card" hidden>
    <h2><span data-i18n="list.title"></span> <button id="clear" data-i18n="list.clear"></button></h2>
    <p class="muted" id="runhint" data-i18n="list.hint"></p>
    <input type="search" id="runfilter" hidden>
    <!-- a tick per run: the overlay (2 or more ticked) and "Ticked runs" in the download panel; a click
         ticks only its row, Ctrl / Shift add (pickRow); the head's box ticks the rows shown (filter) -->
    <div class="scroll"><table id="runs" aria-describedby="runhint"><thead><tr>
      <th class="tick"><input type="checkbox" id="tickall"></th>
      <th data-i18n="runs.run"></th><th data-i18n="runs.file"></th><th data-i18n="runs.folder"></th>
      <th data-i18n="runs.started"></th><th data-i18n="runs.system"></th><th data-i18n="runs.chromatograms"></th>
    </tr></thead><tbody></tbody></table></div>
  </section>

  <section id="view" class="card" hidden>
    <h2 id="runname"></h2>
    <p id="chrompick" hidden><label><span data-i18n="view.chromatogram"></span> <select id="chrom"></select></label></p>
    <div class="frame" id="summarybox"><table id="summary"></table></div>
    <div id="plotbar" hidden>
      <p id="axispick" hidden><label><span data-i18n="view.xaxis"></span> <select id="xaxis"></select></label></p>
      <!-- W11: the plot of the shown run, or of the runs ticked in the list (overlaid by curve role) -->
      <p id="sourcepick" class="seg" role="group"><button id="src-one" class="small"></button><button id="src-ticked" class="small"></button></p>
      <p id="layoutpick" class="seg" role="group"><button id="lay-overlay" class="small"></button><button id="lay-stacked" class="small"></button></p>
      <p id="overlaypick" class="seg" role="group" hidden><button id="lay-roles" class="small"></button><button id="lay-runs" class="small"></button></p>
      <!-- the plot as an image: icons, named by their title (applyLanguage) -->
      <p class="imgs">
        <button id="img-png" class="icon"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13.5h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>PNG</button>
        <button id="img-svg" class="icon"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13.5h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>SVG</button>
      </p>
    </div>
    <div id="curvepick" role="group" hidden></div>
    <div id="overlaynote" class="warn" hidden></div>
    <div id="plot"></div>
    <!-- several runs ticked: which one the tables below are of (the shown, last clicked, run) -->
    <p class="muted" id="tablesof" hidden></p>
    <!-- table titles, origins and notes come from pycorn/export_tables.py: the same names as the downloads -->
    <p class="muted" id="legend" data-i18n-html="legend"></p>
    <details open><summary data-table="phases"></summary><div class="scroll"><table id="phases"></table></div></details>
    <details><summary data-table="injections"></summary><div class="scroll"><table id="injections"></table></div></details>
    <details><summary data-table="fractions"></summary><div class="scroll"><table id="fractions"></table></div></details>
    <!-- hidden when the run has no pooled fractions (showChrom) -->
    <details id="poolsbox"><summary data-table="pools"></summary><div class="scroll"><table id="pools"></table></div></details>
    <!-- M22 (owner, 2026-11-12): curve statistics over windows relative to a phase, for the ticked
         runs (the shown one when 0-1 ticked), folded. The picker writes the window as pycorn export's
         --window text; an edited text fills the picker when Python's parser reads it. No default
         window or curve: the table shows once both are set (Session.window_stats), and the downloads
         then hold it too (options windows / window_curves). Kept in this browser (WIN_PICK). -->
    <details id="winbox"><summary data-table="phase_windows"></summary>
      <p class="muted" id="winhint" data-i18n="win.hint"></p>
      <p class="winform">
        <label><span data-i18n="win.phase"></span> <select id="winphase"></select></label>
        <label><span data-i18n="win.from"></span> <input type="text" id="winfrom" class="off" value="0" spellcheck="false" autocomplete="off" aria-describedby="winhint"></label>
        <label><span data-i18n="win.to"></span> <input type="text" id="winto" class="off" value="end" spellcheck="false" autocomplete="off" aria-describedby="winhint"></label>
        <label><span data-i18n="win.unit"></span> <select id="winunit"></select></label>
        <label><span data-i18n="win.name"></span> <input type="text" id="winname" class="off" spellcheck="false" autocomplete="off"></label>
      </p>
      <p class="winform">
        <label><span data-i18n="win.text"></span> <input type="text" id="wintext" spellcheck="false" autocomplete="off" aria-describedby="winerror"></label>
        <button id="winadd" class="small" data-i18n="win.add"></button>
      </p>
      <p id="winerror" class="warn" role="alert" hidden></p>
      <ul id="winlist" class="winitems"></ul>
      <fieldset id="wincurves"><legend data-i18n="win.curves"></legend>
        <span id="winroles"></span>
        <label><span data-i18n="win.curve_name"></span> <input type="text" id="wincurve" list="wincurvenames" spellcheck="false" autocomplete="off"></label>
        <datalist id="wincurvenames"></datalist>
        <button id="wincurveadd" class="small" data-i18n="win.add_curve"></button>
        <ul id="winnamelist" class="winitems"></ul>
      </fieldset>
      <p><button id="winclear" class="small" data-i18n="win.clear"></button></p>
      <div id="wintable" hidden>
        <p class="muted" data-i18n-html="win.interim"></p>
        <div id="winnotes"></div>
        <div class="scroll"><table id="phase_windows"></table></div>
      </div>
    </details>
    <!-- W6: above, the key information (always shown); below the divider, everything else in one
         group, collapsed by default (KEY_TABLES, VIEW_PICK). Its tables are drawn only when seen. -->
    <details id="more"><summary><span data-i18n="view.more"></span><span class="count" id="morecount"></span></summary>
    <h3 data-i18n="view.group.peaks"></h3>
    <details><summary data-table="peaks"></summary><div class="scroll"><table id="peaks"></table></div></details>
    <details><summary data-table="peak_summary"></summary><div class="scroll"><table id="peak_summary"></table></div></details>
    <h3 data-i18n="view.group.method"></h3>
    <details><summary data-table="hint_blocks"></summary><div class="scroll"><table id="hint_blocks"></table></div></details>
    <details><summary data-table="hint_injections"></summary><div class="scroll"><table id="hint_injections"></table></div></details>
    <details><summary data-table="variables"></summary><div class="scroll"><table id="variables"></table></div></details>
    <details><summary data-table="method_steps"></summary><div class="scroll"><table id="method_steps"></table></div></details>
    <details><summary data-table="scouting_runs"></summary><div class="scroll"><table id="scouting_runs"></table></div></details>
    <details><summary data-table="start_questions"></summary><div class="scroll"><table id="start_questions"></table></div></details>
    <h3 data-i18n="view.group.details"></h3>
    <details><summary data-table="run_details"></summary><div class="scroll"><table id="run_details"></table></div></details>
    <details><summary data-table="column"></summary><div class="scroll"><table id="column"></table></div></details>
    <details><summary data-table="calibration"></summary><div class="scroll"><table id="calibration"></table></div></details>
    <details><summary data-table="instrument"></summary><div class="scroll"><table id="instrument"></table></div></details>
    <details><summary data-table="system_settings"></summary><div class="scroll"><table id="system_settings"></table></div></details>
    <h3 data-i18n="view.group.audit"></h3>
    <details><summary data-table="audit_log"></summary><div class="scroll"><table id="audit_log"></table></div></details>
    <details><summary data-table="warnings"></summary>
      <p class="muted" data-i18n-html="warnings.note"></p>
      <div class="scroll"><table id="warnings"></table></div></details>
    </details>
  </section>
  <p class="muted" id="footer"><span data-i18n-html="footer"></span> <span id="version"></span></p>
</main>

<script type="application/json" id="wheels">__PYCORN_WHEELS__</script>
<script type="application/json" id="strings">__PYCORN_STRINGS__</script>
<!-- The engine: Python (Pyodide) and the jobs the page gives it. The page runs this text in a web
     worker, so it stays live while Python reads or writes; where a worker can't start, on the page
     itself (startEngine). Not run as a script here (type text/plain). -->
<script type="text/plain" id="engine">
// makeEngine(post) -> {run(job, args), cancel()}. post(message) tells the page how far a job is:
// {type: "progress", level: "job" | "step", key, vars, extra} (texts: web/i18n), {type: "added", file,
// runs, not_read} after each file. cancel(): the job stops before its next step (file, run, zip);
// a step that is running can't be stopped here (the page then restarts the worker: "Stop now").
function makeEngine(post) {
  // pyodide.js is fetched with its hash (the browser refuses any other file) and run with eval: a
  // worker has no script element (Pyodide then loads its other parts with import())
  const PYODIDE = "https://cdn.jsdelivr.net/pyodide/v314.0.7/full/";
  const PYODIDE_SRI = "sha384-hYKrcQ7FiKU7f1c92md9N2eh7BoBVX4CPkNDfQyyVclsjZevvDOBUkajGcYk1EF8";
  let py = null, session = null, stop = false, drops = 0;
  const overlayRead = new Set();  // runs in Python's overlay cache (W11): no step, no pause for them
  const job = (key, vars, extra) => post({ type: "progress", level: "job", key, vars: vars || {}, extra });
  // an error the page translates: a message {key, values, text} as Python's (text: English)
  const message = (key, values, text) => ({ key, values, text });
  const failure = (msg) => Object.assign(new Error(msg.text), { msg });
  // a moment between steps: a cancel message gets in, and on the page the status line is drawn
  const pause = () => new Promise((r) => setTimeout(r, 30));
  // a file Python wrote, as bytes for the page (sent, not copied, from a worker)
  const withBytes = (r) => (r.path ? { ...r, bytes: py.FS.readFile(r.path).buffer } : r);

  const jobs = {
    async start({ wheels }) {
      // two phases in the status line: the downloads (Pyodide, then numpy and pandas), then Python
      // starting with PyCORN installed from this page
      job("status.downloading");
      const r = await fetch(PYODIDE + "pyodide.js", { integrity: PYODIDE_SRI });
      if (!r.ok) throw failure(message("shell.engine_http", { file: "pyodide.js", status: r.status }, "pyodide.js: HTTP " + r.status));
      (0, eval)(await r.text());
      py = await globalThis.loadPyodide({ indexURL: PYODIDE });
      // Pyodide's own progress lines ("Loading numpy"), after the page's text
      await py.loadPackage(["micropip", "numpy", "pandas"], { messageCallback: (m) => job("status.downloading", {}, m) });
      job("status.starting");
      py.FS.mkdirTree("/wheels");
      const urls = [];
      for (const [name, b64] of Object.entries(JSON.parse(wheels))) {
        py.FS.writeFile("/wheels/" + name, Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)));
        urls.push("emfs:/wheels/" + name);
      }
      // numpy and pandas come from Pyodide; the rest are in this page, so nothing else is fetched
      await py.pyimport("micropip").install(py.toPy(urls), { deps: false });
      py.globals.set("_pycorn_step", (key, values) => post({ type: "progress", level: "step", key, vars: JSON.parse(values) }));
      session = py.runPython("from pycorn.browser import Session\nSession(progress=_pycorn_step)");
      return { names: py.runPython("from pycorn.browser import names\nnames()"),
               python: py.runPython("import sys; sys.version.split()[0]"), pyodide: py.version };
    },
    // files: [{name, data (ArrayBuffer)}], one at a time, each reported ("added") as it is read
    async add({ files }) {
      const folder = "/in/" + (++drops);
      py.FS.mkdirTree(folder);
      for (let i = 0; i < files.length; i++) {
        job("status.reading_file", { n: i + 1, total: files.length, name: files[i].name });
        await pause();
        if (stop) return { cancelled: true };
        const path = folder + "/" + files[i].name.replace(/[\/\\]/g, "_");
        py.FS.writeFile(path, new Uint8Array(files[i].data));
        post({ type: "added", file: i, ...JSON.parse(session.add(py.toPy([path]))) });
      }
      return {};
    },
    // chromatograms (W17): the names ticked in the run list (null: the run's original one), as JSON text
    async view({ index, chromatograms }) { return session.view(index, JSON.stringify(chromatograms || null)); },
    async download({ index, kind, options }) {
      return withBytes(JSON.parse(session.download(index, kind, "/out", JSON.stringify(options))));
    },
    // several runs in one zip (the ticked runs, or all): one run per step. ids: the list's run
    // indexes; curves: the curve names ticked on the plot (null: Python's choice)
    async all({ kind, ids, curves, options }) {
      const pyIds = py.toPy(ids), pyCurves = curves ? py.toPy(curves) : null;
      // no curves: left out, so Python gets None (a JS null arrives as JsNull)
      const kwargs = { ids: pyIds, kind, folder: "/out_all", options: JSON.stringify(options) };
      if (pyCurves) kwargs.curves = pyCurves;
      let start;
      try {
        start = JSON.parse(session.export_start.callKwargs(kwargs));
      } finally {
        pyIds.destroy();
        if (pyCurves) pyCurves.destroy();
      }
      if (start.error) return start;
      const rows = start.ids || ids;
      for (let i = 0; i < rows.length; i++) {
        job("status.writing_run", { n: i + 1, total: rows.length });
        await pause();
        if (stop) return { cancelled: true };
        session.export_one(rows[i]);
      }
      job("status.zipping");
      await pause();
      if (stop) return { cancelled: true };
      return { ...withBytes(JSON.parse(session.export_finish())), runs: rows.length };
    },
    // overlaid runs (W11): each run not read yet goes into Python's cache of thinned curves one
    // per step (progress, Cancel between runs), then the plot data of all of them on one axis.
    // ids: [list's run index, chromatogram name or null (its original one)] (W17: two chromatograms
    // of one run are two ids); roles: the curve roles drawn (null: Python's default); axis: the
    // x axis wanted (null: Python's default)
    async overlay({ ids, roles, axis }) {
      for (let i = 0; i < ids.length; i++) {
        const key = JSON.stringify(ids[i]);
        if (overlayRead.has(key)) continue;
        job("plot.reading_runs", { n: i + 1, total: ids.length });
        await pause();
        if (stop) return { cancelled: true };
        const [index, chrom] = ids[i];
        const r = JSON.parse(chrom === null ? session.overlay_run(index) : session.overlay_run(index, chrom));
        if (!r.error) overlayRead.add(key);
      }
      // the ids as JSON text (their nulls stay None); a JS null would arrive as JsNull: left out, so Python gets None
      const kwargs = { ids: JSON.stringify(ids) };
      if (roles) kwargs.roles = py.toPy(roles);
      if (axis) kwargs.axis = axis;
      try {
        return JSON.parse(session.overlay.callKwargs(kwargs));
      } finally {
        if (kwargs.roles) kwargs.roles.destroy();
      }
    },
    // phase window statistics (M22): ids as the overlay's ([list index, chromatogram or null]); each
    // run is read in a step of its own (progress, Cancel between runs), Python keeps what it found
    async windowInfo({ ids }) {
      for (let i = 0; i < ids.length; i++) {
        job("win.reading_runs", { n: i + 1, total: ids.length });
        await pause();
        if (stop) return { cancelled: true };
        session.window_info(JSON.stringify([ids[i]]));
      }
      return JSON.parse(session.window_info(JSON.stringify(ids)));
    },
    async windowParse({ text }) { return JSON.parse(session.parse_window(text)); },
    async windowStats({ ids, windows, curves, labels }) {
      const w = JSON.stringify(windows), c = JSON.stringify(curves);
      for (let i = 0; i < ids.length; i++) {
        job("win.reading_runs", { n: i + 1, total: ids.length });
        await pause();
        if (stop) return { cancelled: true };
        session.window_stats(JSON.stringify([ids[i]]), w, c);
      }
      return JSON.parse(session.window_stats(JSON.stringify(ids), w, c, JSON.stringify(labels || null)));
    },
    async clear() {
      session.clear();
      overlayRead.clear();
      const removeTree = (path) => {
        for (const n of py.FS.readdir(path)) {
          if (n === "." || n === "..") continue;
          const p = path + "/" + n;
          if (py.FS.isDir(py.FS.stat(p).mode)) removeTree(p); else py.FS.unlink(p);
        }

      };
      try { py.FS.readdir("/in").filter((n) => n !== "." && n !== "..").forEach((n) => removeTree("/in/" + n)); } catch (e) { /* nothing added yet */ }
      return {};
    },
  };
  return {
    run(name, args) { stop = false; return jobs[name](args || {}); },
    cancel() { stop = true; },
  };
}

const groupText = (g) => ({ key: i18n("dl.group.key"), peaks: i18n("dl.group.peaks"), method: i18n("dl.group.method"),

const tickedGroups = () => (names && names.groups ? names.groups.map((g) => g[0]).filter((g) => !groupsOff.has(g)) : null);

// the curves downloaded, by name: those ticked on the shown chromatogram's plot, at full

// the panel as the page stands: which choices apply, the counts, the curves line

function status(text, error) {
  $("status").textContent = text;

// call(job, args) -> the job's result. One job at a time (`busy`). Cancel asks the engine to stop
// before its next step; "Stop now" ends the worker and starts a new one, which reads the files in
// the list again (same files, same order: same rows).
const ENGINE = $("engine").textContent;

let cancelAsked = false, restarting = false, jobLine = "";
let kept = [];  // the File of every file read, in order: the list again after a restart

// opened as a file (origin null) can't start one; there a classic worker does, with importScripts

let workerType = "module";
function newWorker(type) {

  const m = e.data;
  if (m.type === "cancel") { engine.cancel(); return; }
  try {
    const result = await engine.run(m.job, m.args);
    postMessage({ id: m.id, result }, result && result.bytes ? [result.bytes] : []);
  } catch (err) { postMessage({ id: m.id, error: (err && err.msg) || String((err && err.message) || err) }); }

  const url = URL.createObjectURL(new Blob([ENGINE, glue], { type: "text/javascript" }));

  w.onmessage = (e) => { if (worker === w) onEngine(e.data); };
  w.onerror = (e) => {
    e.preventDefault();
    if (worker === w && pending) onEngine({ id: pending.id, error: e.message || message("shell.worker_failed", {}, "the web worker failed") });
  };

  return make((m) => onEngine(m));
}

function onEngine(m) {
  if (m.type === "progress") return progress(m);
  if (m.type === "added") return onAdded(m);
  if (!pending || m.id !== pending.id) return;
  const p = pending;
  pending = null;
  if (m.error !== undefined) p.reject(failure(m.error)); else p.resolve(m.result);
}

function call(job, args, transfer) {
  return new Promise((resolve, reject) => {
    const id = ++jobCount;
    pending = { id, resolve, reject };
    if (worker) worker.postMessage({ id, job, args }, transfer || []);
    else local.run(job, args).then((result) => onEngine({ id, result }), (e) => onEngine({ id, error: e.msg || e.message }));
  });
}

// the status line: the job's line ("Writing run 3 of 12..."), a step of it in brackets; the format
// name and Pyodide's own lines ("Loading numpy") in the page's language
function progress(m) {
  if (cancelAsked) return;
  const vars = { ...m.vars };
  if (vars.kind) vars.kind = kindName(vars.kind);
  const extra = m.extra ? pyodideLine(m.extra) : "";
  const text = i18n(m.key, vars) + (extra ? " " + extra : "");

}
// Pyodide's progress ("Loading numpy, pandas", "Loaded ..."); its other lines are left out
function pyodideLine(text) {
  const loading = /^Loading (.+)$/.exec(text), loaded = /^Loaded (.+)$/.exec(text);
  if (loading) return i18n("shell.pyodide_loading", { packages: loading[1] });
  if (loaded) return i18n("shell.pyodide_loaded", { packages: loaded[1] });
  return "";
}

// a file read by the add job: its rows go into the list at once
function onAdded(m) {
  if (replay) { replay.push(...m.runs); return; }
  if (!adding) return;
  kept.push(adding.files[m.file]);
  adding.count += m.runs.length;
  adding.notRead.push(...m.not_read);
  for (const run of m.runs) {
    addRow(run);
    if (adding.first === null) adding.first = run.index;
  }
  listShown();
}

// the large drop zone and the sample. A filter box is worth its space once the list is long.
function listShown() {

  $("list").hidden = !n;
  $("runfilter").hidden = n < 6;
  $("drop").classList.toggle("compact", n > 0);

// Key, always shown: run name, summary, plot and these tables (open; Injections stays folded,
// owner 2026-11-11). Everything else sits in the
// "More details" group: collapsed by default, open or closed kept in this browser (settings only).
// Its tables are drawn only when seen: closing the group closes its open sections (remembered),
// opening it opens them again, and a section's own toggle draws its table (drawWhenOpened).
const KEY_TABLES = ["phases", "fractions", "pools"];
const VIEW_PICK = "pycorn.view";
function loadViewSettings() {
  for (const id of KEY_TABLES) $(id).closest("details").open = true;

  $("more").open = !!(s && s.more === true);
}
function moreToggled() {
  const more = $("more");
  for (const d of more.querySelectorAll("details")) {
    if (more.open && d.dataset.reopen) { delete d.dataset.reopen; d.open = true; }
    else if (!more.open && d.open) { d.dataset.reopen = "1"; d.open = false; }
  }

}
// the warnings count on the group's title, so a closed group still shows there is something to check
function moreCount() {

  $("morecount").textContent = n ? i18n("view.more_warnings", { count: n }) : "";
}

}

function begin(line) { jobLine = line; status(line); }

function cancelJob() {
  if (!busy || restarting) return;
  if (!cancelAsked) {
    cancelAsked = true;
    if (worker) worker.postMessage({ type: "cancel" }); else local.cancel();
    status(worker ? i18n("status.cancelling") : i18n("status.cancelling_page"));
    $("cancel").textContent = i18n("cancel.stop_now");
    $("cancel").hidden = !worker;

    stopNow();
  }
}

// "Stop now": the running step can't be interrupted, so the worker goes and a new one comes
async function stopNow() {
  restarting = true;
  worker.terminate();
  worker = null;
  if (pending) { const p = pending; pending = null; p.reject(new Stopped()); }
  setBusy(true);

  try {
    worker = newWorker(workerType);
    await call("start", { wheels: $("wheels").textContent });
    replay = [];

      const data = await Promise.all(kept.map(async (f) => ({ name: f.name, data: await f.arrayBuffer() })));
      await call("add", { files: data }, data.map((d) => d.data));
    }

    const body = $("runs").tBodies[0];
    if (replay.length !== body.rows.length) {
      body.innerHTML = "";
      for (const run of replay) addRow(run);

      current = null;
      anchorIndex = null;
      $("view").hidden = true;
      listShown();

  } catch (e) {
    ready = false;
    status(i18n("status.python_failed", { error: errText(e) }), true);
    $("retry").hidden = false;

    restarting = false;
    setBusy(false);
  }

async function start() {
  try {
    if (typeof WebAssembly !== "object") throw failure(message("shell.no_wasm", {}, "this browser has no WebAssembly"));
    const wheels = $("wheels").textContent;
    let info = null;
    for (const type of ["module", "classic"]) {
      try {
        worker = newWorker(type);
        info = await call("start", { wheels });
        workerType = type;
        break;
      } catch (e) {
        console.warn("PyCORN: no " + type + " web worker (" + e.message + ")");
        if (worker) worker.terminate();
        worker = null;
      }
    }
    if (!info) {
      // no web worker here (a locked-down or old browser): Python on the page, as before
      local = newLocal();
      info = await call("start", { wheels });
    }
    names = JSON.parse(info.names);
    buildGroups();
    for (const s of document.querySelectorAll("summary[data-table]")) {
      label(s, s.dataset.table, "");
      // the table's name for screen readers is its section title
      s.id = "h-" + s.dataset.table;
      s.parentElement.querySelector("table").setAttribute("aria-labelledby", s.id);
      s.parentElement.addEventListener("toggle", () => drawWhenOpened(s.parentElement));
    }
    versions = { pycorn: names.version, python: info.python, pyodide: info.pyodide };
    showVersion();
    ready = true;
    $("drop").classList.remove("disabled");
    setBusy(false);
    status(i18n("status.ready"));
    probeSample();
  } catch (e) {
    status(i18n("status.python_failed", { error: errText(e) }), true);
    $("retry").hidden = false;
  }
}

// "Try a sample" needs a sample.zip next to the page (the GitHub Pages build has one; a file or a
// shared drive does not, and then the button stays hidden)
async function probeSample() {
  try {
    const r = await fetch("sample.zip", { method: "HEAD" });
    $("trysample").hidden = !r.ok;
  } catch (e) { /* no network or file://: no button */ }
}

async function trySample() {
  if (!ready || busy) return;
  try {
    const r = await fetch("sample.zip");
    if (!r.ok) throw new Error("HTTP " + r.status);
    await addFiles([new File([await r.blob()], "sample.zip")]);
  } catch (e) {
    status(i18n("sample.failed", { error: errText(e) }), true);
  }
}

// the files are read one by one; each one's runs join the list as soon as it is read (onAdded)
async function addFiles(files) {
  if (!ready || busy || !files.length) return;
  setBusy(true);
  begin(i18n("status.reading", { count: files.length }));
  await breathe();
  adding = { files, count: 0, notRead: [], first: null };
  try {
    const data = await Promise.all(files.map(async (f) => ({ name: f.name, data: await f.arrayBuffer() })));
    const r = await call("add", { files: data }, data.map((d) => d.data));
    const nr = $("notread");
    nr.hidden = !adding.notRead.length;
    nr.innerHTML = "";
    if (adding.notRead.length) {
      nr.append(i18n("notread.head"));
      const ul = document.createElement("ul");
      ul.className = "notes";
      for (const [name, why, msg] of adding.notRead) li(ul, name + ": " + msgText(msg || why));
      nr.append(ul);
    }
    if (r.cancelled || cancelAsked) { status(i18n("status.cancelled_added", { count: adding.count })); return; }
    status(i18n("status.added", { count: adding.count }));
    if (adding.first !== null && shown === null) await show(adding.first, true);
  } catch (e) {
    if (!(e instanceof Stopped)) status(i18n("status.files_failed", { error: errText(e) }), true);
  } finally {
    adding = null;
    setBusy(false);
  }
}

function li(ul, text) {
  const item = document.createElement("li");
  item.textContent = text;
  ul.append(item);
}

function addRow(run) {
  const tr = $("runs").tBodies[0].insertRow();
  tr.dataset.index = run.index;
  const file = run.member ? run.file + " / " + run.member : run.file;
  // the tick: the runs overlaid and downloaded as "Ticked runs"; a click on it ticks or unticks
  // only its row, keeps the others and does not show the run (a selection built by hand)
  const cell = tr.insertCell();
  cell.className = "tick";
  const tick = document.createElement("input");
  tick.type = "checkbox";
  tick.setAttribute("aria-label", i18n("dl.tick_run"));
  tick.addEventListener("click", (e) => e.stopPropagation());
  tick.addEventListener("change", () => ticksChanged());
  cell.append(tick);
  for (const v of [run.name, file, run.folder_path, (run.run_start_local || "").replace("T", " "), run.system, run.n_chromatograms]) {
    tr.insertCell().textContent = v === null || v === undefined ? "" : v;
  }
  if ((run.chromatograms || []).length > 1) chromPicker(tr.cells[tr.cells.length - 1], run);
  // a row is reachable by Tab; a click (or Enter) ticks it alone and shows it, Ctrl / Shift tick
  // several (pickRow, rowKey)
  tr.tabIndex = 0;
  tr.setAttribute("aria-selected", "false");
  tr.addEventListener("click", (e) => pickRow(tr, e.metaKey || e.ctrlKey ? "toggle" : "one", e.shiftKey));
  tr.addEventListener("keydown", (e) => rowKey(tr, e));
}

// -- picking runs in the list (owner, 2026-11-11) --------------------------------------------------
// The ticks are the selection, as in a file explorer: a click ticks only its row and shows that run;
// Ctrl-click (Cmd on a Mac) ticks or unticks one row and keeps the others; Shift-click ticks the rows
// from the anchor (the row last clicked without Shift) to the clicked one, in the list's order and
// skipping rows the filter hides (Ctrl+Shift adds them to the ticks, Shift alone replaces them).
// A row ticked by a click becomes the shown run (tables, run details, chromatogram picker); a row
// unticked by Ctrl-click stays shown when it was. Keys on a focused row: Enter as a click, Space as a
// Ctrl-click, Up / Down move, Shift+Up / Down tick the range as Shift-click does.
let anchorIndex = null;   // list index of the range's start (Shift)
let showWanted = null;    // the run a click asked for while Python was busy (the last click wins)
const rowTick = (tr) => tr.querySelector("td.tick input");
const visibleRows = () => runRows().filter((tr) => !tr.hidden);
function pickRow(tr, mode, range) {
  const index = Number(tr.dataset.index);
  let showIt = true;
  if (range) {
    const rows = visibleRows();
    let from = rows.findIndex((r) => Number(r.dataset.index) === anchorIndex);
    if (from < 0) { from = rows.indexOf(tr); anchorIndex = index; }
    const to = rows.indexOf(tr), lo = Math.min(from, to), hi = Math.max(from, to);
    if (mode !== "toggle") for (const r of runRows()) rowTick(r).checked = false;
    rows.slice(lo, hi + 1).forEach((r) => { rowTick(r).checked = true; });
  } else if (mode === "toggle") {
    rowTick(tr).checked = !rowTick(tr).checked;
    showIt = rowTick(tr).checked;  // unticked: the shown run stays as it is
    anchorIndex = index;
  } else {
    for (const r of runRows()) rowTick(r).checked = r === tr;
    anchorIndex = index;
  }
  showIt = showIt && shown !== index;
  ticksChanged(!showIt);  // a run about to be shown draws the plot itself
  // Ctrl / Shift build a selection: the page stays at the list (a plain click scrolls to the run)
  if (showIt) showWhenIdle(index, mode === "toggle" || range);
  else if (mode === "one" && !range && shown === index && !$("view").hidden) scrollToRun();
}
// show a run now, or once Python is free (the last asked for)
async function showWhenIdle(index, stay) {
  showWanted = index;
  await whenIdle();
  if (showWanted !== index) return;
  showWanted = null;
  if (shown !== index || !current) await show(index, false, stay);
}
function rowKey(tr, e) {
  if (e.target !== tr) return;  // Space on the tick ticks it, keys in the chromatogram picker stay there
  if (e.key === "Enter") { e.preventDefault(); pickRow(tr, "one", false); return; }
  if (e.key === " ") { e.preventDefault(); pickRow(tr, "toggle", false); return; }
  if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
  e.preventDefault();
  const rows = visibleRows(), next = rows[rows.indexOf(tr) + (e.key === "ArrowUp" ? -1 : 1)];
  if (!next) return;
  next.focus();
  if (e.shiftKey) {
    if (anchorIndex === null || !rows.some((r) => Number(r.dataset.index) === anchorIndex)) anchorIndex = Number(tr.dataset.index);
    pickRow(next, e.ctrlKey || e.metaKey ? "toggle" : "one", true);
  }
}

// -- chromatograms of a result (W17, owner 2026-11-11) -------------------------------------------
// A result can hold several chromatograms: the run's own (original) and others imported from
// another result or derived in UNICORN's Evaluation. A row with several gets a folded picker in its
// Chromatograms cell, the original ticked; the plot, tables, downloads and the overlay follow the
// ticks. Rows with one chromatogram have none (Python then takes the original one).
const chromLists = new Map();  // list index -> [{name, kind, source_result_name, copy_of_run}]
const chromTicks = new Map();  // list index -> Set of ticked names
function kindText(c) {
  if (c.kind === "imported") {
    const source = c.source_result_name || c.source_result_id || "?";
    return c.copy_of_run ? i18n("chrom.imported_copy", { source }) : i18n("chrom.imported", { source });
  }
  return c.kind === "derived" ? i18n("chrom.derived") : i18n("chrom.original");
}
// the ticked chromatograms of a row, in stored order (null: a row without a picker)
function tickedChroms(index) {
  const list = chromLists.get(index), on = chromTicks.get(index);
  return list && on ? list.map((c) => c.name).filter((n) => on.has(n)) : null;
}
function chromSummary(index) {
  return i18n("chrom.count", { ticked: tickedChroms(index).length, count: chromLists.get(index).length });
}
function chromPicker(cell, run) {
  const index = run.index;
  chromLists.set(index, run.chromatograms);
  chromTicks.set(index, new Set(run.chromatograms.filter((c) => c.kind === "original").map((c) => c.name)));
  if (!chromTicks.get(index).size) chromTicks.get(index).add(run.chromatograms[0].name);
  cell.textContent = "";
  const box = document.createElement("details");  // folded by default
  box.className = "chroms";
  const head = document.createElement("summary");
  box.append(head);
  const hint = document.createElement("p");
  hint.className = "muted";
  box.append(hint);
  const boxes = [];
  for (const c of run.chromatograms) {
    const label = document.createElement("label");
    const tick = document.createElement("input");
    tick.type = "checkbox";
    tick.checked = chromTicks.get(index).has(c.name);
    tick.addEventListener("change", () => {
      const on = chromTicks.get(index);
      if (tick.checked) on.add(c.name); else on.delete(c.name);
      if (!on.size) { tick.checked = true; on.add(c.name); }  // one at least
      chromsChanged(index);
    });
    const kind = document.createElement("span");
    kind.className = "muted";
    label.append(tick, " " + c.name + " ", kind);
    box.append(label);
    boxes.push([c, kind]);
  }
  // the texts again in the page's language (applyLanguage calls this through chromTexts)
  box.texts = () => {
    head.textContent = chromSummary(index);
    hint.textContent = i18n("chrom.hint");
    for (const [c, kind] of boxes) kind.textContent = "(" + kindText(c) + ")";
  };
  box.texts();
  // a click in the picker neither shows the run nor folds anything else
  box.addEventListener("click", (e) => e.stopPropagation());
  box.addEventListener("keydown", (e) => e.stopPropagation());
  cell.append(box);
}
function chromTexts() { for (const box of document.querySelectorAll("#runs details.chroms")) box.texts(); }
// ticks changed: the summary, the shown run again (when it is this one), the panel and the overlay
async function chromsChanged(index) {
  chromTexts();
  updatePanel();
  overlayTicked();
  winChanged();
  if (shown === index) { await whenIdle(); if (shown === index) show(index, false, true); }
}

// the head's tick: on when every row shown (filter) is ticked, half when some are; the rows' shading
// and the panel and plot as the ticks stand. `redraw` false: a run about to be shown draws the plot
function updateTickAll(redraw = true) {
  for (const tr of runRows()) {
    tr.classList.toggle("ticked", rowTick(tr).checked);
    tr.setAttribute("aria-selected", String(rowTick(tr).checked));
  }
  const rows = visibleRows(), on = rows.filter((tr) => rowTick(tr).checked).length;
  $("tickall").checked = rows.length > 0 && on === rows.length;
  $("tickall").indeterminate = on > 0 && on < rows.length;
  updatePanel();
  overlayTicked(redraw);
  winChanged();
}
// the ticks changed (click, tick box, head box): the plot follows them again ("This run" picked on
// the plot bar lasts until then: sourcePick)
function ticksChanged(redraw = true) {
  sourcePick = null;
  updateTickAll(redraw);
}
// tick (or untick) every row the filter shows; hidden rows keep their ticks
function tickAllShown() {
  const on = $("tickall").checked;
  for (const tr of runRows()) if (!tr.hidden) rowTick(tr).checked = on;
  ticksChanged();
}

// filter the run list by any text in a row
function filterRuns() {
  const q = $("runfilter").value.trim().toLowerCase();
  for (const tr of $("runs").tBodies[0].rows) tr.hidden = q !== "" && !tr.textContent.toLowerCase().includes(q);
  updateTickAll();
}

// sort the run list by a column (again: the other way round); numbers as numbers
function sortRuns(th) {
  const col = th.cellIndex, down = th.getAttribute("aria-sort") === "ascending";
  for (const other of th.parentElement.cells) other.removeAttribute("aria-sort");
  th.setAttribute("aria-sort", down ? "descending" : "ascending");
  const body = $("runs").tBodies[0];
  const rows = [...body.rows].sort((a, b) =>
    a.cells[col].textContent.localeCompare(b.cells[col].textContent, undefined, { numeric: true }) * (down ? -1 : 1));
  for (const tr of rows) body.append(tr);
}

// `inner`: called by addFiles, which holds `busy` itself; `stay`: no scroll (the chromatogram picker, W17)
async function show(index, inner, stay) {
  if (busy && !inner) return;
  setBusy(true);
  begin(i18n("status.loading_run"));
  await breathe();
  try {
    const v = JSON.parse(await call("view", { index, chromatograms: tickedChroms(index) }));
    if (cancelAsked) { status(i18n("status.cancelled")); return; }
    if (v.error) { status(i18n("status.run_error", { error: errorOf(v) }), true); return; }
    shown = index;
    current = v;
    for (const tr of $("runs").tBodies[0].rows) {
      const on = Number(tr.dataset.index) === index;
      tr.classList.toggle("shown", on);
      if (on) tr.setAttribute("aria-current", "true"); else tr.removeAttribute("aria-current");
    }
    $("runname").textContent = v.name;
    overlayOn = overlayWanted();  // the plot as the ticks stand (drawn by showChrom)
    tablesOf();
    const pick = $("chrom");
    pick.innerHTML = "";
    // the ticked chromatograms (W17), each with what it is when not the run's own
    v.chromatograms.forEach((c, i) => pick.add(new Option(c.kind && c.kind !== "original" ? c.name + " (" + kindText(c) + ")" : c.name, i)));
    $("chrompick").hidden = v.chromatograms.length < 2;
    setTable($("variables"), v.variables);
    for (const t of DETAILS) setTable($(t), v.details[t]);
    setTable($("warnings"), v.warnings);
    label(document.querySelector('summary[data-table="warnings"]'), "warnings", " (" + v.warnings.rows.length + ")");
    moreCount();
    $("dlnotes").innerHTML = "";
    $("view").hidden = false;
    showChrom(0);
    status(i18n("status.showing", { name: v.name }));
    winChanged();
    // bring the run into view: the list above can be long
    if (!stay) scrollToRun();
  } catch (e) {
    if (!(e instanceof Stopped)) status(i18n("status.run_show_error", { error: errText(e) }), true);
  } finally {
    if (!inner) setBusy(false);
  }
}

const scrollToRun = () => $("runname").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });

function showChrom(i) {
  const c = current.chromatograms[i];
  const sum = $("summary");
  sum.innerHTML = "";
  for (const [label, value] of c.summary) {
    const tr = sum.insertRow();
    const th = document.createElement("th");
    th.textContent = label;
    th.scope = "row";
    tr.append(th);
    tr.insertCell().textContent = fmt(value);
  }
  for (const t of ["phases", "injections", "fractions", "pools", "peaks", "peak_summary", "hint_blocks", "hint_injections"]) setTable($(t), c[t]);
  $("poolsbox").hidden = !(c.pools && c.pools.rows.length);
  drawPlot(c);
}

// a Plotly (d3) number format: `d` decimals when UNICORN specifies them, else 4 significant digits
function numberFormat(d) {
  return Number.isInteger(d) ? "." + d + "f" : ".4~g";
}
// the decimals cell `row` of column `i` is shown with: per column, or per row when the rows'
// units differ (pycorn/display_precision.py); null: no specification
function places(t, i, row) {
  const d = t.decimals ? t.decimals[i] : null;
  return Array.isArray(d) ? d[row] : d;
}
// a value as text; numbers with `d` decimals when UNICORN specifies them (display only)
function fmt(v, d) {
  if (v === null || v === undefined) return "";
  if (typeof v === "number" && Number.isInteger(d)) {
    const s = v.toFixed(d);
    return /^-0(\.0*)?$/.test(s) ? s.slice(1) : s;
  }
  if (typeof v === "number" && !Number.isInteger(v)) return String(Number(v.toPrecision(6)));
  if (typeof v === "string" && /^\d{4}-\d\d-\d\dT/.test(v)) return v.replace("T", " ");
  return String(v);
}

// a section title as the downloads name the table, with its origin (pycorn/export_tables.py)
function label(summary, key, extra) {
  const t = names && names.tables[key];
  if (!t) return;
  summary.textContent = t.title + extra;
  const tag = document.createElement("span");
  tag.className = "tag " + ({ "UNICORN": "u", "User input": "y", "PyCORN calculated": "c", "UNICORN + PyCORN": "m" }[t.origin] || "p");
  tag.textContent = t.origin;
  const hint = names.origins[t.origin] + ". " + t.note;
  tag.title = hint;
  summary.append(tag);
  // the table's origin as text, in its open section (a closed one just opens)
  const details = summary.parentElement;
  tag.classList.add("hint");
  tag.tabIndex = 0;
  const open = (e) => {
    if (!details.open) return;
    e.preventDefault();
    e.stopPropagation();
    showHint(details, details.querySelector(":scope > .scroll, :scope > p, :scope > .cols") || summary.nextSibling, t.title, hint);
  };
  tag.addEventListener("click", open);
  tag.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") open(e); });
}

// column i's origin underline and hover text (meaning, how to check it)
function originClass(t, i) {
  return { "PyCORN calculated": "pc", "PyCORN analysis": "pa", "User input": "py" }[(t.origins || [])[i]] || "";
}
function columnHint(t, i) {
  const origin = (t.origins || [])[i];
  if (!origin) return "";
  const check = (t.checks || [])[i];
  return origin + (t.meanings[i] ? ": " + t.meanings[i] : "") + (check ? "\n" + i18n("table.check", { check }) : "");
}

// the columns a wide table shows: the user's pick (kept in this browser), else its default set
// (`shown` in pycorn/export_tables.py), else all. Downloads always hold every column.
const PICKS = "pycorn.columns.";
function savedPick(key) {
  try { return JSON.parse(localStorage.getItem(PICKS + key) || "null"); } catch (e) { return null; }
}
function savePick(key, columns) {
  try {
    if (columns) localStorage.setItem(PICKS + key, JSON.stringify(columns));
    else localStorage.removeItem(PICKS + key);
  } catch (e) { /* storage blocked: the pick lasts until the table is drawn again */ }
}
function defaultColumns(key) { return (names && names.tables[key] && names.tables[key].shown) || []; }
// in the pick's order (the default set is listed in the order it reads best)
function visibleColumns(key, columns) {
  for (const want of [savedPick(key), defaultColumns(key)]) {
    const found = (want || []).map((c) => columns.indexOf(c)).filter((i) => i >= 0);
    if (found.length) return found;
  }
  return columns.map((c, i) => i);
}

// the "Columns (n of m)" button above a table that has a default set; it opens a menu of the
// columns (popover). A redraw of the same table keeps the menu open, its filter and the focus.
let menuCount = 0;
function columnPicker(el, t, show) {
  const p = tableBar(el);
  if (!p) return;
  if (!p.querySelector(".colbtn")) {
    if (!defaultColumns(el.id).length) return;
    const open = document.createElement("button");
    open.className = "colbtn";
    const menu = document.createElement("div");
    menu.className = "menu";
    menu.id = "colmenu" + ++menuCount;
    menu.popover = "auto";
    open.setAttribute("popovertarget", menu.id);
    // a popover sits in the top layer: put it under its button (page coordinates, so it scrolls along)
    menu.addEventListener("toggle", (e) => {
      if (e.newState !== "open") return;
      const r = open.getBoundingClientRect();
      menu.style.top = r.bottom + window.scrollY + "px";
      menu.style.left = Math.max(4, Math.min(r.left, document.documentElement.clientWidth - menu.offsetWidth - 4)) + window.scrollX + "px";
      (menu.querySelector("input[type=search]") || menu.querySelector("input")).focus();
    });
    p.prepend(open, menu);
  }
  const open = p.querySelector(".colbtn"), menu = p.querySelector(".menu");
  if (p.hidden) { if (menu.matches(":popover-open")) menu.hidePopover(); return; }
  open.textContent = i18n("columns.summary", { shown: show.length, total: t.columns.length });
  if (menu.table === t && menu.lang === lang) {
    menu.querySelectorAll(".list input").forEach((tick, i) => { tick.checked = show.includes(i); });
    return;
  }
  menu.table = t;
  menu.lang = lang;
  menu.innerHTML = "";
  const list = document.createElement("div");
  list.className = "list";
  t.columns.forEach((c, i) => {
    const lab = document.createElement("label");
    lab.title = columnHint(t, i);
    const tick = document.createElement("input");
    tick.type = "checkbox";
    tick.checked = show.includes(i);
    tick.addEventListener("change", () => {
      // keep the order shown; a ticked column goes after the shown column before it in the table
      const picked = visibleColumns(el.id, t.columns).map((j) => t.columns[j]).filter((x) => x !== c);
      if (tick.checked) {
        const before = t.columns.slice(0, i).filter((x) => picked.includes(x)).pop();
        picked.splice(before === undefined ? 0 : picked.indexOf(before) + 1, 0, c);
      }
      if (!picked.length) { tick.checked = true; return; }
      savePick(el.id, picked);
      fillTable(el, t);
    });
    const name = document.createElement("span");
    name.textContent = c;
    name.className = originClass(t, i);
    lab.append(tick, name);
    list.append(lab);
  });
  // a filter box for a long list
  if (t.columns.length > 10) {
    const filter = document.createElement("input");
    filter.type = "search";
    filter.placeholder = i18n("columns.filter");
    filter.setAttribute("aria-label", i18n("columns.filter"));
    filter.addEventListener("input", () => {
      const q = filter.value.trim().toLowerCase();
      list.querySelectorAll("label").forEach((lab, i) => { lab.hidden = !!q && !t.columns[i].toLowerCase().includes(q); });
    });
    menu.append(filter);
  }
  const foot = document.createElement("div");
  foot.className = "foot";
  for (const [text, columns] of [[i18n("columns.defaults"), null], [i18n("columns.all"), t.columns]]) {
    const b = document.createElement("button");
    b.className = "small";
    b.textContent = text;
    b.addEventListener("click", () => { savePick(el.id, columns); fillTable(el, t); });
    foot.append(b);
  }
  menu.append(list, foot);

// Tables are drawn when their section is open (a run has thirteen, some with thousands of rows):

}

// "Curves (n of m)": which curves the plot draws (also what a click on the legend does). The
// Excel and CSV downloads take the curves switched on here (tickedCurves).
function curveSummary(p) {
  return i18n("curves.summary", { shown: p.curves.filter(curveOn).length, total: p.curves.length });
}
function curvePicker(p) {
  const d = $("curvepick");
  d.hidden = p.curves.length < 2;
  d.innerHTML = "";
  const count = document.createElement("span");
  count.className = "count";
  count.textContent = curveSummary(p);
  d.setAttribute("aria-label", count.textContent);
  d.append(count);
  p.curves.forEach((k, i) => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.style.setProperty("--c", curveColor(i));
    chip.setAttribute("aria-pressed", String(curveOn(k)));
    chip.textContent = k.unit ? k.name + " (" + k.unit + ")" : k.name;
    chip.addEventListener("click", () => setCurves(p, [k.name], !curveOn(k)));
    d.append(chip);
  });
  for (const [text, all] of [[i18n("columns.all"), true], [i18n("curves.none"), false]]) {
    const b = document.createElement("button");
    b.className = "small";
    b.textContent = text;
    b.addEventListener("click", () => setCurves(p, p.curves.map((k) => k.name), all));
    d.append(b);
  }
}

// switch curves on or off: the axes are laid out again, the x zoom stays, and so does the keyboard
// focus (the chips are updated, not made again)
function setCurves(p, curveNames, on) {
  for (const n of curveNames) curveChoice.set(n, on);
  const c = current.chromatograms[Number($("chrom").value) || 0];
  const keep = plotRanges();
  // stacked: the panels change with the curves, so only the x zoom stays
  drawPlot(c, stackedOn() ? { xaxis: keep.xaxis } : { xaxis: keep.xaxis, yaxis: keep.yaxis }, true);
  const d = $("curvepick");
  d.querySelectorAll("button.chip").forEach((chip, i) => { chip.setAttribute("aria-pressed", String(curveOn(p.curves[i]))); });
  d.querySelector(".count").textContent = curveSummary(p);
  d.setAttribute("aria-label", curveSummary(p));
}

// the zoom the user set, for a redraw ({xaxis, yaxis, yaxis2, ...}; an axis still on autorange stays on it)
function plotRanges() {
  const gd = $("plot"), keep = {};
  // the overlay's right axes and the stacked panels' axes (stackedId) too; y3 (marks) and y4 (tracks) never zoom
  const axes = Object.keys(gd.layout || {}).filter((k) => /^[xy]axis\d*$/.test(k) && k !== "yaxis3" && k !== "yaxis4");
  for (const axis of axes) {
    const a = gd.layout && gd.layout[axis];
    // zoomed: autorange off, or a range that a redraw gave without turning autorange off
    if (a && a.autorange !== true && a.range) keep[axis] = [...a.range];
  }
  return keep;
}

// the plot as an image: PNG at twice the size, or SVG for a document
async function saveImage(format) {
  if (!current) return;
  const c = current.chromatograms[Number($("chrom").value) || 0];
  if (!c || !c.plot || !c.plot.curves.length) return;
  const plot = $("plot"), keep = plotRanges();
  // an image goes into documents: light colors, also from a dark page
  const dark = theme().card !== LIGHT.card;
  try {
    if (dark) { lightPlot = true; await drawPlot(c, keep); }
    await Plotly.downloadImage("plot", {
      format, filename: fileSafe(overlayOn ? "overlay" : current.name + "_" + c.name), width: Math.max(plot.clientWidth, 900),
      height: plot.clientHeight, scale: format === "png" ? 2 : 1,
    });
    status(i18n("status.image_saved"));
  } catch (e) {
    status(i18n("status.not_written", { error: e.message }), true);
  } finally {
    if (dark) { lightPlot = false; await drawPlot(c, keep); }
  }
}

// `keep`: axis ranges to draw with ({xaxis, yaxis, ...}), for a redraw that must not undo a zoom;
// `chipsKept`: the curve chips stay as they are (setCurves updates them)
function drawPlot(c, keep, chipsKept) {
  if (overlayOn) return drawOverlay(keep);
  keep = keep || {};
  const th = theme();
  const p = c.plot;
  $("axispick").hidden = true;
  $("plotbar").hidden = true;
  if (!chipsKept) $("curvepick").hidden = true;
  $("plot").removeAttribute("role");
  $("plot").removeAttribute("aria-label");
  if (!p || !p.curves.length) { Plotly.purge("plot"); $("plot").textContent = i18n("plot.empty"); return Promise.resolve(); }
  $("plot").textContent = "";
  $("plot").setAttribute("role", "img");
  $("plot").setAttribute("aria-label", i18n("plot.label", { name: current.name + ": " + c.name }));
  $("plotbar").hidden = false;
  sourceButtons();
  const key = plotAxis(p), ax = p.axes.find((a) => a.key === key), clock = key === "clock";
  const xname = axisName(ax), small = SMALL.matches;
  // a small screen: the margins as wide as the axes need. Elsewhere Plotly's own (an explicit
  // automargin: false also keeps the shifted right axes from widening the margin: they overlap)
  const fit = small ? { automargin: true } : {};
  const pick = $("xaxis");
  pick.innerHTML = "";
  for (const a of p.axes) pick.add(new Option(axisName(a), a.key));
  pick.value = key;
  $("axispick").hidden = p.axes.length < 2;
  if (!chipsKept) curvePicker(p);
  const stacked = stackedOn();
  const panels = stacked ? stackedUnits(p).length : 1;
  for (const [id, text, on] of [["lay-overlay", i18n("plot.overlay"), !stacked], ["lay-stacked", i18n("plot.stacked"), stacked]]) {
    $(id).textContent = text;
    $(id).setAttribute("aria-pressed", String(on));
  }
  $("layoutpick").setAttribute("aria-label", i18n("plot.layout"));
  const axes = stacked ? stackedAxes(p) : curveAxes(p);
  const traces = p.curves.map((k, i) => {
    const pct = axes[i] === SCALED_AXIS;
    return {
      x: k.x[key], y: pct ? scaled(k.y) : k.y, customdata: pct ? k.y : undefined,
      name: k.unit ? k.name + " (" + k.unit + ")" : k.name, type: "scatter", mode: "lines",
      line: { width: 1.25, color: curveColor(i) }, yaxis: axes[i], visible: curveOn(k),
      hovertemplate: (pct ? "%{customdata:" : "%{y:") + numberFormat(k.decimals) + "}" + (k.unit ? " " + k.unit : ""),
    };
  });
  // marks (injections): a thin line over the full plot height at each x, like the pause marks,
  // with the label at the top (the line is a shape, so it is the same on every x axis; the
  // trace carries the label and the hover text, and has no legend entry that would not hide the line)
  const style = { injections: [th.inj, 0.97] };
  const markShapes = [];
  for (const m of p.marks) {
    const [color, y] = style[m.kind];
    const [x, labels] = pairs(m.x[key], m.labels);
    for (const v of x) {
      markShapes.push({ type: "line", xref: "x", yref: "paper", x0: v, x1: v, y0: 0, y1: 1,
                        line: { color, width: 1 }, layer: "below" });
    }
    traces.push({
      x, y: x.map(() => y), text: labels, name: names.tables[m.kind].title, yaxis: "y3", type: "scatter",
      mode: x.length <= 60 ? "markers+text" : "markers", textposition: "middle right", textfont: { size: 9, color },
      marker: { symbol: "line-ns-open", color, size: 10, line: { width: 1, color } }, showlegend: false,
      hovertemplate: "%{text}",
    });
  }
  const tracks = trackTraces(p, key, th);
  traces.push(...tracks.traces);
  // 480 px, less on a short window (never under 360)
  const base = Math.max(360, Math.min(480, Math.round(window.innerHeight * 0.6)));
  const height = base + TRACK_PX * tracks.lanes.length + STACK_PX * (panels - 1);
  $("plot").style.height = height + "px";
  // the tracks' share of the plot area (the base height less the margins, legend and x axis title;
  // a small screen has no legend and no title)
  const share = tracks.lanes.length ? (TRACK_PX * tracks.lanes.length) / (height - (small ? 80 : 150)) : 0;
  const top = share ? 1 - share - 0.03 : 1;
  const unit = ax.unit ? " (" + ax.unit + ")" : "";
  // the right axes in use: the first beside the plot, the others shifted out beside it. y2 is
  // always laid out (curves switched off sit on it), drawn when in use, or with nothing on at all
  const used = new Set(axes.filter((a, i) => curveOn(p.curves[i])));
  const left = used.has("y");
  const drawn = [...RIGHT_AXES, SCALED_AXIS].filter((a) => used.has(a));
  if (!drawn.length && !left) drawn.push("y2");
  const right = {};
  // stacked: the panels' axes instead (each its own domain, all on the shared x axis; the lowest
  // panel carries the x axis), the injection marks' axis (y3) overlaying the top panel
  const gap = 0.05, panelH = (top - gap * (panels - 1)) / panels;
  const stack = {};
  for (let n = 0; stacked && n < panels; n++) {
    const id = stackedId(n), hi = top - n * (panelH + gap);
    stack["yaxis" + id.slice(1)] = { ...axisStyle(p, axes, id), domain: [Math.max(0, hi - panelH), hi], anchor: "x",
                                     range: keep["yaxis" + id.slice(1)], gridcolor: th.grid, zerolinecolor: th.spike, ...fit };
  }
  for (const a of stacked ? [] : new Set(["y2", ...drawn])) {
    const n = drawn.indexOf(a);
    right["yaxis" + a.slice(1)] = {
      ...axisStyle(p, axes, a), overlaying: "y", side: "right", zeroline: false, range: keep["yaxis" + a.slice(1)],
      visible: n >= 0, ...fit,
      // with no left curve, the first right axis draws the grid
      showgrid: n === 0 && !left, gridcolor: th.grid,
      ...(n > 0 ? { anchor: "free", autoshift: true, shift: 8 } : {}),
    };
  }
  return Plotly.newPlot("plot", traces, {
    font: { family: 'system-ui, "Segoe UI", Arial, sans-serif', size: small ? 10 : 12, color: th.fg },
    paper_bgcolor: th.card, plot_bgcolor: th.card,
    // a small screen: the run's name is above the plot already, the curve chips are the legend
    title: small ? undefined : { text: current.name + ": " + c.name, font: { size: 15 } },
    showlegend: !small,
    // cursor: a vertical line across the plot, x and every curve's y at it in one label
    hovermode: "x unified", hoverlabel: { font: { size: small ? 10 : 13 } },
    hoversubplots: "axis",  // the tracks' lines too: they share the x axis but sit on yaxis4
    // clock values are ms on the instrument's local clock: a date axis shows them as they are
    xaxis: { anchor: stacked ? stackedId(panels - 1) : undefined,
             title: { text: xname + unit }, type: clock ? "date" : "linear", gridcolor: th.grid, zerolinecolor: th.spike, range: keep.xaxis,
             showspikes: true, spikemode: "across", spikethickness: 1, spikedash: "solid", spikecolor: th.spike,
             hoverformat: clock ? "%H:%M:%S" : numberFormat(ax.decimals), ...fit,
             // the cursor label's header: what x is, and its unit (Plotly 3.1+)
             unifiedhovertitle: { text: clock ? xname + ": %{x|%Y-%m-%d %H:%M:%S}" + unit
                                              : xname + ": %{x:" + numberFormat(ax.decimals) + "}" + (ax.unit ? " " + ax.unit : "") } },
    // with no left curve, no left axis (its ticks would belong to nothing shown)
    yaxis: { ...axisStyle(p, axes, "y"), domain: [0, top], range: keep.yaxis, visible: left,
             gridcolor: th.grid, zerolinecolor: th.spike, ...fit },
    ...right,
    ...stack,
    yaxis3: { overlaying: "y", range: [0, 1], visible: false, fixedrange: true },
    // the tracks: one row each, phases on top
    yaxis4: { domain: [Math.min(top + 0.03, 1), 1], type: "category", categoryorder: "array",
              categoryarray: [...tracks.lanes].reverse(), fixedrange: true, showgrid: false, zeroline: false,
              visible: tracks.lanes.length > 0, ...fit },
    barmode: "overlay",
    shapes: [...markShapes, ...tracks.shapes],
    // l: room for the track names also when there is no left axis (a small screen: as much as the
    // names and ticks need, t: room for Plotly's buttons)
    legend: { orientation: "h", y: -0.2 },
    margin: small ? { t: 28, r: 8, l: 8, b: 8 } : { t: 40, r: 60, l: 90 },
  }, { responsive: true, displaylogo: false,
       // no camera button: "Image (PNG)" and "Image (SVG)" above the plot save it (always light)
       modeBarButtonsToRemove: ["toImage"] })
    .then((gd) => {
      // a click on a curve's legend entry goes through the curve selector, so the two never disagree
      // (the other entries, injection marks, keep Plotly's own behavior)
      gd.removeAllListeners("plotly_legendclick");
      gd.on("plotly_legendclick", (ev) => {
        if (ev.curveNumber >= p.curves.length) return true;
        setCurves(p, [p.curves[ev.curveNumber].name], !curveOn(p.curves[ev.curveNumber]));
        return false;
      });
      gd.removeAllListeners("plotly_hover");
      gd.on("plotly_hover", (ev) => placeHoverLabel(gd, ev.event));
      // after every draw (zoom, resize, curves on or off) the track labels are fitted to the bars
      gd.removeAllListeners("plotly_afterplot");
      gd.on("plotly_afterplot", () => fitBarLabels(gd));
      fitBarLabels(gd);
    });
}

// A track's label is the bar's name when it fits, the name cut short when it doesn't, and at
// least its first letter however narrow the bar is (Plotly alone hides what needs a font under
// a minimum, which emptied the tracks when many curves narrowed the plot). Fits: measured in the
// track font, not counted in characters (a guess per character cut short names that fit).
let measurer = null;
function textWidth(s) {
  if (!measurer) {
    measurer = document.createElement("canvas").getContext("2d");
    measurer.font = '11px system-ui, "Segoe UI", Arial, sans-serif';  // the track font (trackTraces, drawPlot)
  }
  return measurer.measureText(s).width;
}
function fitBarLabels(gd) {
  const xa = gd._fullLayout && gd._fullLayout.xaxis;
  if (!xa || !xa._length) return;
  const lo = xa.r2l(xa.range[0]), hi = xa.r2l(xa.range[1]);
  if (!(hi > lo)) return;
  const idx = [], texts = [];
  gd.data.forEach((tr, i) => {
    if (tr.type !== "bar" || !tr.meta || !tr.meta.barNames) return;
    const text = tr.meta.barNames.map((name, j) => {
      const seen = Math.min(tr.base[j] + tr.x[j], hi) - Math.max(tr.base[j], lo);
      const room = seen / (hi - lo) * xa._length - 6;  // Plotly keeps 3 px inside each end
      const chars = Array.from(name);
      if (!chars.length) return "";
      if (textWidth(name) <= room) return name;
      let n = chars.length - 1;
      while (n > 1 && textWidth(chars.slice(0, n).join("") + "…") > room) n--;
      return n > 1 ? chars.slice(0, n).join("") + "…" : chars[0];
    });
    if (text.some((s, j) => s !== tr.text[j])) { idx.push(i); texts.push(text); }
  });
  if (idx.length) Plotly.restyle(gd, { text: texts }, idx);
}

// Phase, fraction and pause tracks above the curves, as the figures in docs/RUN_STRUCTURE_GUIDE.md:
// each table row a bar from start to end. A pause has no method time, volume or CV (the clock
// and the pumps stop): there it is a mark with a dotted line down through the curves; on the
// clock it is a bar as long as the pause, shaded through the curves. An invisible trace per
// track puts "what ran here" into the cursor label at every x.
const TRACK_PX = 26;
const STACK_PX = 150;  // each stacked panel after the first adds this much height
const PHASE_COLORS = ["#c6dbef", "#fdd0a2", "#c7e9c0", "#dadaeb", "#fcbba1", "#fde0ef", "#d9f0d3", "#ffffcc"];
const FRACTION_COLORS = ["#c9c9c9", "#e3e3e3"];
const INLET_COLORS = ["#d8e8e4", "#f1e4c8", "#e0d9ee", "#e8dcd0", "#d3e5cf", "#efd7dc"];

function trackTraces(p, key, th) {
  const lanes = [], traces = [], shapes = [];
  const pauseLane = names.tables.pauses.title;
  const grid = [].concat(...p.curves.map((k) => k.x[key])).filter((x) => x !== null);
  const tracks = (p.tracks || []).map((t) => ({
    // a track made from a table is named as the table; the inlets track names itself
    kind: t.kind, lane: t.title || names.tables[t.kind].title,
    bars: t.bars.filter((b) => key in b.start).map((b) => ({ name: b.name, pseudo: b.pseudo, start: b.start[key], end: b.end[key],
                                                             percentB: (b.percent_b || {})[key] || [] })),
  }));
  const ramps = [];  // the inlets bars' %B program: [lane, [[x, %B], ...]], drawn once the lanes are known
  const pauses = p.pauses || [];
  if (key === "clock") {
    tracks.push({ kind: "pauses", lane: pauseLane,
                  bars: pauses.filter((q) => q.start !== undefined).map((q) => ({ name: q.label, start: q.start, end: q.end })) });
  }
  for (const t of tracks) {
    if (!t.bars.length) continue;
    lanes.push(t.lane);
    const byName = {};
    const colors = t.bars.map((b, i) => {
      if (t.kind === "pauses") return "#f2c4bd";
      if (t.kind !== "phases" && t.kind !== "inlets") return b.pseudo ? "#f4f4f4" : FRACTION_COLORS[i % 2];
      const palette = t.kind === "inlets" ? INLET_COLORS : PHASE_COLORS;
      if (!(b.name in byName)) byName[b.name] = palette[Object.keys(byName).length % palette.length];
      return byName[b.name];  // a phase (or an inlet set) that comes back keeps its color
    });
    traces.push({
      type: "bar", orientation: "h", yaxis: "y4", y: t.bars.map(() => t.lane), base: t.bars.map((b) => b.start),
      x: t.bars.map((b) => b.end - b.start), text: t.bars.map((b) => b.name), textposition: "inside",
      insidetextanchor: "middle", textangle: 0, textfont: { size: 11, color: "#222" }, width: 0.8, cliponaxis: true,
      constraintext: "none", meta: { barNames: t.bars.map((b) => b.name) },  // fitBarLabels() shortens the text to the bar
      marker: { color: colors, line: { color: th.card, width: 1 } }, hoverinfo: "skip", showlegend: false,
    });
    if (t.kind === "inlets") for (const b of t.bars) if (b.percentB.length > 1) ramps.push([t.lane, b.percentB]);
    if (t.kind === "pauses") {
      for (const b of t.bars) {
        shapes.push({ type: "rect", xref: "x", yref: "paper", x0: b.start, x1: b.end, y0: 0, y1: 1, layer: "below",
                      fillcolor: th.fill, line: { width: 0 } });
      }
    }
    // the bar at each x of the curves (bars are in start order): the cursor label's line for this
    // track; bar starts and middles too, for stretches with no curve points (a pause on the clock)
    const ends = [].concat(...t.bars.map((b) => [b.start, (b.start + b.end) / 2]));
    const xs = [...new Set(grid.concat(ends))].sort((a, b) => a - b);
    const text = [];
    let i = 0;
    for (const x of xs) {
      while (i < t.bars.length && t.bars[i].end < x) i++;
      const b = t.bars[i];
      text.push(b && b.start <= x ? b.name : i18n("table.none"));
    }
    // an invisible line, not invisible markers: one SVG path instead of an element per point (tens
    // of thousands with every curve's x), which made each redraw take a second
    traces.push({
      type: "scatter", mode: "lines", yaxis: "y4", x: xs, y: xs.map(() => t.lane), text, name: t.lane,
      line: { width: 0 }, showlegend: false, hovertemplate: t.lane + ": %{text}<extra></extra>",
    });
  }
  const points = key === "clock" ? [] : pauses.filter((q) => key in q.at);
  if (points.length) {
    lanes.push(pauseLane);
    traces.push({
      type: "scatter", mode: "markers", yaxis: "y4", x: points.map((q) => q.at[key]), y: points.map(() => pauseLane),
      text: points.map((q) => q.label), name: pauseLane, showlegend: false, hovertemplate: "%{text}<extra></extra>",
      marker: { symbol: "line-ns-open", size: 16, color: th.pause, line: { width: 2, color: th.pause } },
    });
    for (const q of points) {
      shapes.push({ type: "line", xref: "x", yref: "paper", x0: q.at[key], x1: q.at[key], y0: 0, y1: 1,
                    line: { color: th.pause, width: 1, dash: "dot" }, layer: "below" });
    }
  }
  // %B across an inlets bar: bottom of the bar 0 %B, top 100 %B (bars are 0.8 of a lane high;
  // the lanes are listed top down, the category axis counts bottom up)
  for (const [lane, points] of ramps) {
    const row = lanes.length - 1 - lanes.indexOf(lane);
    const y = (pct) => row - 0.4 + 0.8 * pct / 100;
    for (let i = 1; i < points.length; i++) {
      shapes.push({ type: "line", xref: "x", yref: "y4", x0: points[i - 1][0], x1: points[i][0],
                    y0: y(points[i - 1][1]), y1: y(points[i][1]), line: { color: "#555", width: 1.5 } });
    }
  }
  return { lanes, traces, shapes };
}

// -- overlaid runs (W11) ---------------------------------------------------------------------------
// The plot of the shown run, or of the runs ticked in the list (2 or more ticked, or "Ticked runs"
// picked on the plot bar: sourcePick), OVERLAY_MAX at most (owner, 2026-11-11; more ticked: the first ones, said in a
// note). By curve role (pycorn/curve_roles.py), never by curve name: "Curves as panels" (one panel
// per role, a color per run, a line style per curve of the role) or "Runs as panels" (one panel per
// run, its curves overlaid); the choice is kept in this browser, as W10's. Python reads each run once

// with the picker (Session.overlay); a run without that axis is left out with a note.
const OVERLAY_MAX = 10;
const OVERLAY_PICK = "pycorn.overlaylayout";

}
// a role's name in the page's language (the role's key for one this page doesn't know)
const ROLE_NAMES = { uv: () => i18n("plot.role.uv"), conductivity: () => i18n("plot.role.conductivity"),
                     conductivity_percent: () => i18n("plot.role.conductivity_percent"), ph: () => i18n("plot.role.ph"),
                     pressure: () => i18n("plot.role.pressure"), temperature: () => i18n("plot.role.temperature"),
                     conc_b: () => i18n("plot.role.conc_b"), conc_q: () => i18n("plot.role.conc_q"),
                     flow: () => i18n("plot.role.flow"), sample_flow: () => i18n("plot.role.sample_flow") };

// names go into Plotly's labels, which read a little HTML
const plain = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const shownChrom = () => current.chromatograms[Number($("chrom").value) || 0];

const whenIdle = () => new Promise((r) => { const t = () => (busy ? setTimeout(t, 100) : r()); t(); });

// several runs ticked: one line naming the run the tables below are of

// a tick changed in the list: overlay or not, the button's count, and the overlay drawn again (after

  sourceButtons();

// a label per drawn [run, chromatogram] (pickKey) that tells them apart: the run name, with the file

function runLabels(ids) {
  const rows = new Map(runRows().map((tr) => [Number(tr.dataset.index), tr]));
  const name = (i) => (rows.has(i) ? rows.get(i).cells[1].textContent : "#" + i);
  const file = (i) => (rows.has(i) ? rows.get(i).cells[2].textContent : "");
  const runs = [...new Set(ids.map(([i]) => i))], count = {};
  for (const i of runs) count[name(i)] = (count[name(i)] || 0) + 1;

async function drawOverlay(keep) {
  const draw = ++overlayDraws;

  $("plotbar").hidden = false;
  sourceButtons();
  if (!ids.length) {
